# NVDLA nv_small official trace dc_14x7x49_3x4x49x32_int8_0: input 14x7x49,
# kernel (R x S) 4x3, K=32, stride 1 -> output 14x7x32.
# Encoded as 14x8 input with symmetric pad (1,1) -- see the
# padding note in gen_nvdla_workload.py; input-volume delta is reported, not hidden.
# Dims decoded from the trace's CSC register programming (see gen_nvdla_workload.py).
# Layer 0 is a shaping dummy (nebula's loader takes only 1/3-channel inputs);
# the comparison reads layer_1.txt only.
[net]
height=8
width=14
channels=3
batch=1

[data]
dataset=imagenet
test=datasets/imagenet/test.lst
labels=datasets/imagenet/labels.lst
weight=weights/nvdla_dc_14x7x49_3x4x49x32.wgh
top=1

[convolutional]
filters=49
size=1
stride=1
padding=0
activation=linear

[convolutional]
filters=32
filter_height=4
filter_width=3
stride=1
padding_height=1
padding_width=1
activation=linear

[cost]
type=l2
