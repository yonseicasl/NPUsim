# NVDLA nv_small official trace dc_32x26x76_6x3x76x16_int8_0: input 32x26x76,
# kernel (R x S) 3x6, K=16, stride 1 -> output 29x28x16.
# Encoded as 32x26 input with symmetric pad (2,1) -- see the
# padding note in gen_nvdla_workload.py; input-volume delta is reported, not hidden.
# Dims decoded from the trace's CSC register programming (see gen_nvdla_workload.py).
# Layer 0 is a shaping dummy (nebula's loader takes only 1/3-channel inputs);
# the comparison reads layer_1.txt only.
[net]
height=26
width=32
channels=3
batch=1

[data]
dataset=imagenet
test=datasets/imagenet/test.lst
labels=datasets/imagenet/labels.lst
weight=weights/nvdla_dc_32x26x76_6x3x76x16.wgh
top=1

[convolutional]
filters=76
size=1
stride=1
padding=0
activation=linear

[convolutional]
filters=16
filter_height=3
filter_width=6
stride=1
padding_height=2
padding_width=1
activation=linear

[cost]
type=l2
