# NVDLA nv_small official trace dc_8x16x128_3x3x128x32_int8: input 8x16x128,
# kernel (R x S) 3x3, K=32, stride 1 -> output 7x17x32.
# Encoded as 9x17 input with symmetric pad (1,0) -- see the
# padding note in gen_nvdla_workload.py; input-volume delta is reported, not hidden.
# Dims decoded from the trace's CSC register programming (see gen_nvdla_workload.py).
# Layer 0 is a shaping dummy (nebula's loader takes only 1/3-channel inputs);
# the comparison reads layer_1.txt only.
[net]
height=17
width=9
channels=3
batch=1

[data]
dataset=imagenet
test=datasets/imagenet/test.lst
labels=datasets/imagenet/labels.lst
weight=weights/nvdla_dc_8x16x128_3x3x128x32.wgh
top=1

[convolutional]
filters=128
size=1
stride=1
padding=0
activation=linear

[convolutional]
filters=32
filter_height=3
filter_width=3
stride=1
padding_height=1
padding_width=0
activation=linear

[cost]
type=l2
