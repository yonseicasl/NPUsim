# NVDLA nv_small official trace_tests point: dc_1x1x8_1x1x8x1_int8_0
# (ext/nvdla/verif/tests/trace_tests/nv_small/dc_1x1x8_1x1x8x1_int8_0/).
# Single-atomic-tile INT8 direct convolution: input 1x1x8, kernel 1x1x8x1,
# output 1x1x1. A 1x1 spatial conv whose kernel exactly covers the single
# input pixel is mathematically a fully-connected layer (in=8, out=1) -- no
# spatial reduction occurs either way -- so this is expressed as [connected]
# to route around NPUsim's OpenCV-backed image loader, which only accepts
# 1 or 3 input channels (see ext/nebula/models/networks/convolutional.cc:289).
# gen_workload.py (validation/phase2/) uses the same [connected] encoding for
# its RTL-comparison GEMM points.
[net]
height=8
width=1
channels=1
batch=1

[data]
dataset=imagenet
test=datasets/imagenet/test.lst
labels=datasets/imagenet/labels.lst
weight=weights/nvdla_dc_1x1x8_1x1x8x1.wgh
top=1

[connected]
output=1
activation=relu

[cost]
type=l2
