# NVDLA nv_small official trace dc_4x1x8192_1x1x8192x1_int8_0: input 4x1x8192,
# kernel (R x S) 1x1, K=1, stride 3 -> output 2x1x1.
# Encoded as 4x1 input with symmetric pad (0,0) -- see the
# padding note in gen_nvdla_workload.py; input-volume delta is reported, not hidden.
# Dims decoded from the trace's CSC register programming (see gen_nvdla_workload.py).
# Layer 0 is a shaping dummy (nebula's loader takes only 1/3-channel inputs);
# the comparison reads layer_1.txt only.
[net]
height=1
width=4
channels=3
batch=1

[data]
dataset=imagenet
test=datasets/imagenet/test.lst
labels=datasets/imagenet/labels.lst
weight=weights/nvdla_dc_4x1x8192_1x1x8192x1.wgh
top=1

[convolutional]
filters=8192
size=1
stride=1
padding=0
activation=linear

[convolutional]
filters=1
filter_height=1
filter_width=1
stride=3
padding_height=0
padding_width=0
activation=linear

[cost]
type=l2
