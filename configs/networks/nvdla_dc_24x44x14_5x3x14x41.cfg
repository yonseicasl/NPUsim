# NVDLA nv_small official trace dc_24x44x14_5x3x14x41_int8_0: input 24x44x14,
# kernel (R x S) 3x5, K=41, stride 1 -> output 26x45x41.
# Encoded as 24x45 input with symmetric pad (1,3) -- see the
# padding note in gen_nvdla_workload.py; input-volume delta is reported, not hidden.
# Dims decoded from the trace's CSC register programming (see gen_nvdla_workload.py).
# Layer 0 is a shaping dummy (nebula's loader takes only 1/3-channel inputs);
# the comparison reads layer_1.txt only.
[net]
height=45
width=24
channels=3
batch=1

[data]
dataset=imagenet
test=datasets/imagenet/test.lst
labels=datasets/imagenet/labels.lst
weight=weights/nvdla_dc_24x44x14_5x3x14x41.wgh
top=1

[convolutional]
filters=14
size=1
stride=1
padding=0
activation=linear

[convolutional]
filters=41
filter_height=3
filter_width=5
stride=1
padding_height=1
padding_width=3
activation=linear

[cost]
type=l2
