# NVDLA nv_small official trace dc_35x22x54_6x8x54x29_int8_0: input 35x22x54,
# kernel (R x S) 8x6, K=29, stride 1 -> output 36x24x29.
# Encoded as 35x23 input with symmetric pad (4,3) -- see the
# padding note in gen_nvdla_workload.py; input-volume delta is reported, not hidden.
# Dims decoded from the trace's CSC register programming (see gen_nvdla_workload.py).
# Layer 0 is a shaping dummy (nebula's loader takes only 1/3-channel inputs);
# the comparison reads layer_1.txt only.
[net]
height=23
width=35
channels=3
batch=1

[data]
dataset=imagenet
test=datasets/imagenet/test.lst
labels=datasets/imagenet/labels.lst
weight=weights/nvdla_dc_35x22x54_6x8x54x29.wgh
top=1

[convolutional]
filters=54
size=1
stride=1
padding=0
activation=linear

[convolutional]
filters=29
filter_height=8
filter_width=6
stride=1
padding_height=4
padding_width=3
activation=linear

[cost]
type=l2
