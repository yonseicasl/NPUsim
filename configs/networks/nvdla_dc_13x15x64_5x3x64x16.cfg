# NVDLA nv_small official trace dc_13x15x64_5x3x64x16_int8_0: input 13x15x64,
# kernel (R x S) 3x5, K=16, stride 1 -> output 12x14x16.
# Encoded as 14x16 input with symmetric pad (0,1) -- see the
# padding note in gen_nvdla_workload.py; input-volume delta is reported, not hidden.
# Dims decoded from the trace's CSC register programming (see gen_nvdla_workload.py).
# Layer 0 is a shaping dummy (nebula's loader takes only 1/3-channel inputs);
# the comparison reads layer_1.txt only.
[net]
height=16
width=14
channels=3
batch=1

[data]
dataset=imagenet
test=datasets/imagenet/test.lst
labels=datasets/imagenet/labels.lst
weight=weights/nvdla_dc_13x15x64_5x3x64x16.wgh
top=1

[convolutional]
filters=64
size=1
stride=1
padding=0
activation=linear

[convolutional]
filters=16
filter_height=3
filter_width=5
stride=1
padding_height=0
padding_width=1
activation=linear

[cost]
type=l2
