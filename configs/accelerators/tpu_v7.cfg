# Google TPU v7 "Ironwood" (Cloud name TPU7x), one chip, bf16 mode. NO TPU v7 MEASUREMENT BACKS THIS FILE:
# it is tpu_v5e.cfg re-parameterised from published figures, with the choices below. Sources: Cloud TPU docs
# (docs.cloud.google.com/tpu/docs/tpu7x), Jouppi et al., "Google's Training Supercomputers from TPU v2 to
# Ironwood" (IEEE Micro 2026, Table 1; refs/tpu/README.md).
#
# PUBLISHED: 2 TensorCores (one per chiplet) and 4 SparseCores; peak 2307 TFLOPS bf16 / 4614 TFLOPS fp8;
#   MXUs per TPU "4, 256x256 bf16 / 4, 512x512 fp8"; VMEM 128 MiB; HBM3E x8, 192 GiB, 7380 GB/s (Cloud docs;
#   the paper's table rounds to 7300); ICI 6 links. The clock is not published.
# DERIVED / CHOSEN HERE:
#   * Clock 2200 MHz. 4 x 512^2 MAC x 2 FLOP x f = 4614 TFLOPS gives f = 2.2 GHz, and bf16 at half that rate is
#     2307 TFLOPS = 4 MXUs x 131072 MAC/cycle x 2 x 2.2 GHz -- the "128K MAC/cycle" per 256x256 MXU of the Cloud
#     docs. (4 x 256^2 at one MAC per cell would need 4.4 GHz.)
#   * NPUsim arrays do one MAC per cell per cycle, so the chip is modeled as 8 arrays of 256x256
#     ([multi_chip] 8 x 1; two per published MXU): 8 x 256^2 x 2 x 2.2 GHz = 2307 TFLOPS. How the real MXU reaches
#     131072 MAC/cycle is not public; only the total rate and the 256-wide tile are taken from the sources.
#     Mappings need DIM 256 and 8 MXUs (validation/palm/palm_decode.py: palm.DIM, palm.MXUS).
#   * Links scale with the 256-wide array: one 256-element bf16 row per cycle (4096 bits) into an array, one
#     256-wide fp32 vector (8192 bits) on the result path. HBM and its staging move 4 KB lines so the staging
#     link (9011 GB/s) does not cap the HBM (7380 GB/s = 3355 B per 2200 MHz cycle: one 4 KB line per 1.221 cycles).
#   * VMEM partitions x4 over v5e's, following the published 32 -> 128 MiB.
#   * program_setup_cycle and layer_setup_cycle keep the TIMES measured on Cloud TPU v5e-1 (0.69 us and 0.22 us,
#     i.e. 1518 and 484 cycles at 2200 MHz) on the assumption that they belong to the XLA runtime rather than to
#     the chip. Not measured on v7: set them to 0 to drop the assumption.
#   * Everything else (overlap and residency knobs, buffer organisation, unit costs) is tpu_v5e.cfg's.
# Not modeled: fp8 mode (512x512 MXUs), SparseCores, the two-chiplet split of the HBM, ICI.
[accelerator]
num_threads=1
# Once-per-program cost: the TIME measured on Cloud TPU v5e-1, carried to 2200 MHz (not measured on v7; see the header) -- (validation/tpu_v5e/, smallk chain intercept: a program of
# n dependent kernels costs 0.69 us + n x per-kernel): 0.69 us x 2200 MHz = 1518 cycles. One NPUsim run is one
# program; compare_v5e.py --in-program zeroes it for kernels measured inside a loop or chain.
program_setup_cycle = 1518
# Layers of one run overlap like kernels of one XLA program: the next layer's off-chip prologue runs under the
# previous layer's tail (smallk oddchain: chained small GEMMs cost their weight bytes at ~712 GB/s, no per-kernel
# fill/drain). Single-layer runs are unaffected.
interlayer_overlap = 1
# Activations between layers stay in on-chip memory when they fit (smallk oddchain: a chained kernel costs its
# weight bytes only, ~712 GB/s, not its input and output). compare_v5e.py --chain sets 2 (the run's own input
# and output too, a kernel in the middle of a chain).
activation_residency = 1
# Weight strips are DRAM-level iterations; the layer timeline counts them as tiles, so the pipeline fills once
# per GEMM instead of once per strip (validation/tpu_v5e: compute-bound GEMMs carried ~1 us per strip).
timeline_dram_tiles = 1
num_chips=8
compression_type = dense
input_format = bf16
weight_format = bf16
output_format = bf16
accumulator_format = fp32

[systolic_array]
memory_type = separate
# Per-PE operand buffers (bytes): a fold streams up to 512 bf16 rows of activations.
input_size = 2048
weight_size = 64
output_size = 64
double_buffer = 1
# MXU outputs accumulate in the accumulators at the array edge.
edge_accumulation = 1
weight_fold_fill_cycle = 0
# Per-kernel cost inside one XLA program: the TIME measured on Cloud TPU v5e-1, carried to 2200 MHz (not measured on v7) -- (validation/tpu_v5e/, smallk chain:
# n dependent 8x128x128 matmuls cost 0.69 us + 0.22 us per kernel): 0.22 us x 2200 MHz = 484 cycles.
layer_setup_cycle = 484

mac_stationary = weight_stationary
computation_cycle = 1
computation_energy = 0
mac_read_cycle = 1:1:1
mac_read_energy = 0:0:0
mac_write_cycle = 1:1:1
mac_write_energy = 0:0:0
mac_line_size = 16:16:16
lb_read_cycle = 1.0:1.0:1.0
lb_read_energy = 0:0:0
lb_write_cycle = 1.0:1.0:1.0
lb_write_energy = 0:0:0
lb_line_size = 16:16:16
static_energy = 0.0:0.0:0.0
transfer_cycle_pe = 1
transfer_energy_pe = 0

frequency = 2200
bandwidth = 1126400
# One 256-element bf16 row per cycle into or out of the array.
bitwidth = 4096
line_size = 16:16:16

pe_stationary = weight_stationary
height = 256
width = 256
pe_array_read_cycle = 1.0:1.0:1.0
pe_array_read_energy = 0
pe_array_write_cycle = 1.0:1.0:1.0
pe_array_write_energy = 0
noc = bus
noc_cycle = 1
noc_energy = 0
writeback_injection_parallel = 1
array_fabric_separate = 1
operand_streams_pipelined = 1
# The MXU's weight registers are double-buffered: the next 256x256 tile shifts in while the
# current one computes, and rows stream fold after fold without draining the wavefront.
streams_pipelined = 1

# VMEM share of one MXU (KB). The activation partition holds the whole per-chip activation,
# which the 8 arrays read from one VMEM copy (inputs are identical across the output-column
# split); weights stream through in 256-column strips.
[separate]
stationary_type = output_stationary
memory_type = separate
input_size = 98304
weight_size = 16384
output_size = 8192
read_cycle = 1.0:1.0:1.0
read_energy = 0:0:0
write_cycle = 1.0:1.0:1.0
write_energy = 0:0:0
bypass=0:0:0
static_energy = 0.0:0.0:0.0
transfer_cycle = 1
transfer_energy = 0
frequency = 2200
bandwidth = 2252800
# The MXU result path into its accumulators moves one 256-wide fp32 vector per cycle (8192 bits);
# the accumulators are modeled by the output partition, so the port is that wide.
bitwidth = 8192
line_size = 8192:8192:8192
fabric_separate = 1
streams_pipelined = 1
double_buffer = 1

# HBM -> VMEM DMA staging, fanned out to the 8 arrays. The DMA double-buffers: the next strip
# lands while the current one is consumed, so the staging writes do not serialize.
[multi_chip]
double_buffer = 1
max_outstanding_requests = 16
stationary_type = output_stationary
memory_type = shared
memory_size = 131072
height = 8
width  = 1
read_cycle = 1.0:1.0:1.0
read_energy = 0.0:0.0:0.0
write_cycle = 1.0:1.0:1.0
write_energy = 0.0:0.0:0.0
static_energy = 0.0:0.0:0.0
frequency = 2200
bandwidth = 9011200
bitwidth = 32768
line_size = 32768:32768:32768
noc = bus
noc_cycle = 1
noc_energy = 0

# HBM3E x8, 7380 GB/s = 3355 B per 2200 MHz cycle: one 4 KB line per 1.221 cycles (analytical; no MOSAIC yaml of
# this HBM exists yet).
[dram]
read_cycle = 1.221:1.221:1.221
read_energy = 0:0:0
write_cycle = 1.221:1.221:1.221
write_energy = 0:0:0
transfer_cycle = 1.221
transfer_energy = 0
frequency=2200
bandwidth=7380000
bitwidth= 32768
line_size=32768:32768:32768
