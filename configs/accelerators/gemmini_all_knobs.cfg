# RE8 fixture: EVERY optional-feature energy knob non-zero at once -- reduction, weight fold,
# layer setup, accumulator spill, output cast, DRAM row activation, PE/PE-array leakage -- on a
# fully declared calibrated-pJ config. The energy total identity (E7) was only ever checked on
# eyeriss_energy, where all of these are 0, so dropping one from a component subtotal or
# adding it twice was undetectable: adding 0 to the right row looks the same as adding it to
# the wrong one. E11 re-runs the same identity here, where every axis carries energy.
#
# The DRAM open-page TIMING knobs (t_ras/t_rp/t_wtr/t_rtw) are declared too, so that
# bank parallelism has something to overlap -- without them num_banks changes nothing at
# all, which is what validation/knobs/check.py first reported it as.
#
# exist_temporal_buffer = 1 turns ON the PE-array and multi-chip temporal buffers. Every one
# of the 48 shipped configs ships that line COMMENTED OUT, so both buffers were pass-through
# everywhere and the PE-array buffer's five cost knobs (line_size, pe_array_read/write_cycle,
# pe_array_read/write_energy) had no coverage in any gate -- they were invisible even to the
# dead-knob sweep, which can only see settings a config declares. gemmini.cfg stays the
# pass-through case, and validation/array_buffer/check.py crosses the two.
# E9 fixture: gemmini.cfg with a MULTI-LANE MAC (number_of_macs = 1, mac_width = 4) and a
# NON-ZERO mac_reduction_energy (0.4). Every shipped config leaves mac_width at 1, so
# the lane->accumulator adder tree never had any work and the reduction knob had no
# regression at all. validation/reduction/check.py checks the adder-tree identity:
# an N-leaf tree performs N-1 additions per issue.
[accelerator]
energy_unit = pJ
energy_reference = synthetic-fixture-not-measured-silicon
num_threads=1
num_chips=1
compression_type = dense
input_format = int8
weight_format = int8
output_format = int8

[systolic_array]
# PE configuration
memory_type = separate
# Per-PE streaming row buffer: 512B x 256 PEs = 128KB = the A-operand half of
# Gemmini's 256KB scratchpad.
input_size = 512
weight_size = 64
output_size = 64

# LB7/P1-A: PE local-buffer double buffering is a TIMING property -- it decides whether
# the LB<->MAC transfer hides behind the MAC compute schedule or serializes against it.
# Stated explicitly (the built-in default is 1) so the critical-path contract is not silent.
double_buffer = 1

# V3: Gemmini accumulates outputs in the 64KB array-edge accumulator SRAM (modeled by
# the GLB output partition); per-PE local buffers never hold the output tile.
edge_accumulation = 1

# V2: RTL-calibrated weight-residency fold fill. Gemmini RTL (Verilator, 6 GEMM points)
# measures ~14 cycles of load/accumulate-drain bubble per array-wide weight residency
# and ~2270 cycles of per-layer setup (config/flush/DMA prologue).
weight_fold_fill_cycle = 14
layer_setup_cycle = 2270

number_of_macs = 1
mac_width = 4
mac_reduction_energy = 0.4
weight_fold_fill_energy = 3.0
layer_setup_energy = 500.0
accumulator_spill_energy = 0:0:0.5
pe_array_static_energy = 0.02:0.02:0.02

mac_stationary = weight_stationary
#pe_parameter_order = kbpqcrs

# MAC computation cycle/energy
computation_cycle = 1
computation_energy = 0.56
mac_energy_int8_int8_fp32 = 0.56
mac_read_cycle = 1:1:1
mac_read_energy = 0:0:0
mac_write_cycle = 1:1:1
mac_write_energy = 0:0:0
mac_line_size = 8:8:8
# Local buffer read/write cycle/energy
lb_read_cycle = 1.0:1.0:1.0
lb_read_energy = 0.18:0.44:0.33
lb_write_cycle = 1.0:1.0:1.0
lb_write_energy = 0.18:0.51:0.33
lb_line_size = 8:8:8

static_energy = 0.01:0.01:0.01
# transfer cycle between MAC and Local buffer.
transfer_cycle_pe = 1
transfer_energy_pe = 0

# Frequency (MHz) and Bandwidth (MB/sec)
frequency = 200
bandwidth = 8192
bitwidth = 128
line_size = 8:8:8

# PE array configuration
pe_stationary = weight_stationary

# Height and width of PE array
height = 16
width = 16

exist_temporal_buffer = 1

#PE array read/write cycle/energy
pe_array_read_cycle = 1.0:1.0:1.0
pe_array_read_energy = 0.4
pe_array_write_cycle = 1.0:1.0:1.0
pe_array_write_energy = 0.5

# NoC type and unit cycle/energy
noc = bus
noc_cycle = 1
noc_energy = 0

# GLB configuration
[separate]
# Stationary type between GLB and DRAM
stationary_type = output_stationary

# GLB type
memory_type = separate

# GLB buffer size
input_size = 128
weight_size = 128
output_size = 64

# GLB read/write cycle/energy
read_cycle = 1.0:1.0:1.0
read_energy = 3.06:1.07:3.06
write_cycle = 1.0:1.0:1.0
write_energy = 3.00:0.96:3.00
bypass=0:0:0

static_energy = 0.0:0.0:0.0

# Transfer cycle/energy between PE array and GLB
transfer_cycle = 1
transfer_energy = 0

# Frequency (MHz) and Bandwidth(MB/sec)
frequency = 200
bandwidth = 8192
bitwidth = 128
line_size = 128:128:128

[multi_chip]

stationary_type = output_stationary

exist_temporal_buffer = 1
memory_type = shared
memory_size = 256

height = 1
width  = 1

read_cycle = 1.0:1.0:1.0
read_energy = 0.0:0.0:0.0
output_cast_energy = 0:0:0.25
write_cycle = 1.0:1.0:1.0
write_energy = 0.0:0.0:0.0

static_energy = 0.0:0.0:0.0

frequency = 200
bandwidth = 8192
bitwidth = 128
line_size = 128:128:128

noc = bus
noc_cycle = 1
noc_energy = 0.5

[dram]

dram_config = DRAM/DDR3_8Gb_x16_1600.ini
output_dir = eyeriss_DRAM

read_cycle = 3:3:3
read_energy = 64:64:64

write_cycle = 3:3:3
write_energy = 64:64:64

transfer_cycle = 3
transfer_energy = 0
row_buffer_size = 0.25
row_miss_energy = 20
t_ras_cycle = 7
t_rp_cycle = 3
t_wtr_cycle = 2
t_rtw_cycle = 2
num_banks = 8

# Frequency (MHz) and Bandwidth (MB/sec)
frequency=200
bandwidth=8192
bitwidth= 64
line_size=8:8:8
