# PHASE 4 CALIBRATED FIXTURE. Every on-chip SRAM energy below is generated by CACTI 7 for the
# geometry this config declares, at 22 nm -- see validation/phase4/PROVENANCE.md for the tool
# commit, the base config and every override. This is the first config in the repo whose energy has
# a traceable external origin, which is what RE2 gated absolute power on.
#
# The shipped gemmini.cfg numbers are NOT reproducible from its declared geometry, in two ways that
# hold at every technology node:
#   * its GLB input and weight buffers are both declared 128 KB yet priced 3.06 and 1.07 pJ/access,
#     a 2.9x gap two identical arrays cannot have;
#   * its 64 B weight local buffer is priced 0.44 pJ/access against 0.18 for the 512 B input buffer,
#     i.e. the smaller array costs 2.4x MORE per access, which no SRAM model produces.
# So those numbers encode something other than array geometry. They are left alone -- they may come
# from post-layout Gemmini data this repo does not contain -- but they carry no provenance, and
# validation/phase4/check.py records the inconsistency rather than letting it be quietly matched.
#
# The DRAM terms are DRAMsim3-derived for the device this config NAMES
# (DRAM/DDR3_8Gb_x16_1600.ini): 56.531 pJ/byte read x 8 B per transaction, and the
# JEDEC activate energy. The row size and tRAS/tRP are the device's own. See PROVENANCE.md.
#
# gemmini.cfg declares 64 pJ per transaction = 8 pJ/byte for the SAME device -- 7.07x low --
# and every other shipped config declares that same 64 whatever device it names, though the
# devices differ 4.5x per byte (HBM2 12.56 vs DDR3-1600 56.53). Note what IS device-derived
# there: gemmini_dram_detail's t_ras_cycle = 7 is exactly 28 tCK x 1.25 ns / 5 ns. So within one
# fixture the DRAM TIMING follows the named device to the cycle while its ENERGY does not follow
# it at all. `dram_config` itself is inert unless the build defines DRAMSIM3 (npusim.sh has
# DRAMSIM3=0 by default), so the device name cannot be inferred from behaviour either.
#
# STILL NOT calibrated: the MAC compute energy, inherited from gemmini.cfg. Neither CACTI nor
# DRAMsim3 models an arithmetic unit and Accelergy's table plug-in carries only template rows.
[accelerator]
energy_unit = pJ
energy_reference = on-chip SRAM from CACTI 7 commit 1ffd8dfb @22nm itrs-hp 360K for the declared geometry; DRAM from DRAMsim3 DDR3_8Gb_x16_1600 JEDEC IDD model (validation/phase4/PROVENANCE.md); MAC compute energy inherited from gemmini.cfg and NOT externally calibrated
num_threads=1
num_chips=1
compression_type = dense
input_format = int8
weight_format = int8
output_format = int8

[systolic_array]
# PE configuration
memory_type = separate
# Per-PE streaming row buffer: 512B x 256 PEs = 128KB = the A-operand half of
# Gemmini's 256KB scratchpad.
input_size = 512
weight_size = 64
output_size = 64

# LB7/P1-A: PE local-buffer double buffering is a TIMING property -- it decides whether
# the LB<->MAC transfer hides behind the MAC compute schedule or serializes against it.
# Stated explicitly (the built-in default is 1) so the critical-path contract is not silent.
double_buffer = 1

# V3: Gemmini accumulates outputs in the 64KB array-edge accumulator SRAM (modeled by
# the GLB output partition); per-PE local buffers never hold the output tile.
edge_accumulation = 1

# V2: RTL-calibrated weight-residency fold fill. Gemmini RTL (Verilator, 6 GEMM points)
# measures ~14 cycles of load/accumulate-drain bubble per array-wide weight residency
# and ~2270 cycles of per-layer setup (config/flush/DMA prologue).
weight_fold_fill_cycle = 14
layer_setup_cycle = 2270

mac_stationary = weight_stationary
#pe_parameter_order = kbpqcrs

# MAC computation cycle/energy
computation_cycle = 1
computation_energy = 0.56
mac_energy_int8_int8_fp32 = 0.56
mac_read_cycle = 1:1:1
mac_read_energy = 0:0:0
mac_write_cycle = 1:1:1
mac_write_energy = 0:0:0
mac_line_size = 8:8:8
# Local buffer read/write cycle/energy
lb_read_cycle = 1.0:1.0:1.0
lb_read_energy = 0.1819:0.0404:0.0404
lb_write_cycle = 1.0:1.0:1.0
lb_write_energy = 0.1540:0.0713:0.0713
lb_line_size = 8:8:8

static_energy = 0.9415:0.2065:0.2065
# transfer cycle between MAC and Local buffer.
transfer_cycle_pe = 1
transfer_energy_pe = 0

# Frequency (MHz) and Bandwidth (MB/sec)
frequency = 200
bandwidth = 8192
bitwidth = 128
line_size = 8:8:8

# PE array configuration
pe_stationary = weight_stationary

# Height and width of PE array
height = 16
width = 16

#exist_temporal_buffer = 1

#PE array read/write cycle/energy
pe_array_read_cycle = 1.0:1.0:1.0
pe_array_read_energy = 0
pe_array_write_cycle = 1.0:1.0:1.0
pe_array_write_energy = 0

# NoC type and unit cycle/energy
noc = bus
noc_cycle = 1
noc_energy = 0

# GLB configuration
[separate]
# Stationary type between GLB and DRAM
stationary_type = output_stationary

# GLB type
memory_type = separate

# GLB buffer size
input_size = 128
weight_size = 128
output_size = 64

# GLB read/write cycle/energy
read_cycle = 1.0:1.0:1.0
read_energy = 12.0501:12.0501:8.4307
write_cycle = 1.0:1.0:1.0
write_energy = 10.5294:10.5294:9.3146
bypass=0:0:0

static_energy = 194.0300:194.0300:104.1980

# Transfer cycle/energy between PE array and GLB
transfer_cycle = 1
transfer_energy = 0

# Frequency (MHz) and Bandwidth(MB/sec)
frequency = 200
bandwidth = 8192
bitwidth = 128
line_size = 128:128:128

[multi_chip]

stationary_type = output_stationary

#exist_temporal_buffer = 1
memory_type = shared
memory_size = 256

height = 1
width  = 1

read_cycle = 1.0:1.0:1.0
read_energy = 18.9589:18.9589:18.9589
write_cycle = 1.0:1.0:1.0
write_energy = 16.0138:16.0138:16.0138

static_energy = 384.8265:384.8265:384.8265

frequency = 200
bandwidth = 8192
bitwidth = 128
line_size = 128:128:128

noc = bus
noc_cycle = 1
noc_energy = 0

[dram]

dram_config = DRAM/DDR3_8Gb_x16_1600.ini
output_dir = eyeriss_DRAM

read_cycle = 3:3:3
read_energy = 452.25:452.25:452.25

write_cycle = 3:3:3
write_energy = 452.25:452.25:452.25

transfer_cycle = 3
transfer_energy = 0
# the device's own row (1024 columns x 16 b x 4 devices = 8 KB), JEDEC activate energy,
# and tRAS/tRP converted from 1.25 ns tCK to the 200 MHz model clock
row_buffer_size = 8
row_miss_energy = 5325.75
t_ras_cycle = 7
t_rp_cycle = 2.75

# Frequency (MHz) and Bandwidth (MB/sec)
frequency=200
bandwidth=8192
bitwidth= 64
line_size=8:8:8
