# Google TPU v5e, one chip (Cloud TPU docs; JAX scaling book): 1 TensorCore x 4 MXUs of 128x128 bf16,
# 1500 MHz derived from the published 197 TFLOPS (4 x 128^2 x 2 x 1.5 GHz), HBM2e 16 GiB at 819 GB/s.
# Derived from tpu_v4.cfg (same MXU and VMEM-share organization, see its header); only the MXU count,
# clock and HBM bandwidth differ. One value comes from TPU measurement, layer_setup_cycle (see there);
# validation/tpu_v5e/ compares it with Cloud TPU v5e measurements (Colab v5e-1, Kaggle TpuV5E8 / TRC).
[accelerator]
num_threads=1
num_chips=4
compression_type = dense
input_format = bf16
weight_format = bf16
output_format = bf16
accumulator_format = fp32

[systolic_array]
memory_type = separate
# Per-PE operand buffers (bytes): a fold streams up to 512 bf16 rows of activations.
input_size = 2048
weight_size = 64
output_size = 64
double_buffer = 1
# MXU outputs accumulate in the accumulators at the array edge.
edge_accumulation = 1
weight_fold_fill_cycle = 0
# Per-kernel cost inside one XLA program, measured on Cloud TPU v5e-1 (validation/tpu_v5e/, smallk chain:
# n dependent 8x128x128 matmuls cost 0.69 us + 0.22 us per kernel): 0.22 us x 1500 MHz = 330 cycles.
layer_setup_cycle = 330

mac_stationary = weight_stationary
computation_cycle = 1
computation_energy = 0
mac_read_cycle = 1:1:1
mac_read_energy = 0:0:0
mac_write_cycle = 1:1:1
mac_write_energy = 0:0:0
mac_line_size = 16:16:16
lb_read_cycle = 1.0:1.0:1.0
lb_read_energy = 0:0:0
lb_write_cycle = 1.0:1.0:1.0
lb_write_energy = 0:0:0
lb_line_size = 16:16:16
static_energy = 0.0:0.0:0.0
transfer_cycle_pe = 1
transfer_energy_pe = 0

frequency = 1500
bandwidth = 384000
# One 128-element bf16 row per cycle into or out of the array.
bitwidth = 2048
line_size = 16:16:16

pe_stationary = weight_stationary
height = 128
width = 128
pe_array_read_cycle = 1.0:1.0:1.0
pe_array_read_energy = 0
pe_array_write_cycle = 1.0:1.0:1.0
pe_array_write_energy = 0
noc = bus
noc_cycle = 1
noc_energy = 0
writeback_injection_parallel = 1
array_fabric_separate = 1
operand_streams_pipelined = 1
# The MXU's weight registers are double-buffered: the next 128x128 tile shifts in while the
# current one computes, and rows stream fold after fold without draining the wavefront.
streams_pipelined = 1

# VMEM share of one MXU (KB). The activation partition holds the whole per-chip activation,
# which the 4 MXUs read from one VMEM copy (inputs are identical across the output-column
# split); weights stream through in 128-column strips.
[separate]
stationary_type = output_stationary
memory_type = separate
input_size = 24576
weight_size = 4096
output_size = 2048
read_cycle = 1.0:1.0:1.0
read_energy = 0:0:0
write_cycle = 1.0:1.0:1.0
write_energy = 0:0:0
bypass=0:0:0
static_energy = 0.0:0.0:0.0
transfer_cycle = 1
transfer_energy = 0
frequency = 1500
bandwidth = 768000
# The MXU result path into its accumulators moves one 128-wide fp32 vector per cycle (4096 bits);
# the accumulators are modeled by the output partition, so the port is that wide.
bitwidth = 4096
line_size = 4096:4096:4096
fabric_separate = 1
streams_pipelined = 1
double_buffer = 1

# HBM -> VMEM DMA staging, fanned out to the 4 MXUs. The DMA double-buffers: the next strip
# lands while the current one is consumed, so the staging writes do not serialize.
[multi_chip]
double_buffer = 1
max_outstanding_requests = 16
stationary_type = output_stationary
memory_type = shared
memory_size = 131072
height = 4
width  = 1
read_cycle = 1.0:1.0:1.0
read_energy = 0.0:0.0:0.0
write_cycle = 1.0:1.0:1.0
write_energy = 0.0:0.0:0.0
static_energy = 0.0:0.0:0.0
frequency = 1500
bandwidth = 1536000
bitwidth = 8192
line_size = 8192:8192:8192
noc = bus
noc_cycle = 1
noc_energy = 0

# HBM2e, 819 GB/s = 546 B per 1500 MHz cycle: one 1 KB line per 1.875 cycles.
[dram]
read_cycle = 1.875:1.875:1.875
read_energy = 0:0:0
write_cycle = 1.875:1.875:1.875
write_energy = 0:0:0
transfer_cycle = 1.875
transfer_energy = 0
frequency=1500
bandwidth=819000
bitwidth= 8192
line_size=8192:8192:8192
