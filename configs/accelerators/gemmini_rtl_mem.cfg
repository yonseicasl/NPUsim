# gemmini_rtl.cfg on the RTL's memory path for L2-missing traffic (validation/phase2/gemm_sweep_cold.c):
# every clock at the RTL's 500 MHz (one harness source; SimDRAM reports a 500 MHz CPU clock), and the
# 64-bit AXI port between the L2 and SimDRAM (axi4_mem_0, 8 B per cycle) as the off-chip link. Run with
# NPUSIM_MOSAIC_DRAM = MOSAIC's configs/architecture/dram/ddr3_1333_simdram.yaml for SimDRAM's DDR3;
# without it the DRAM is the analytical 16 B per cycle of gemmini_rtl.cfg. Mappings: gemmini_rtl's.
# gemmini.cfg plus the fabric structure of the Gemmini RTL it is validated against
# (Chipyard GemminiRocketConfig, gemmini/Configs.scala defaultConfig), so the memory-
# inclusive critical path -- not only the compute schedule -- tracks the RTL's end-to-end
# tiled_matmul_auto cycles (validation/phase2/check_critical_path.py). The GEMM mappings
# follow the RTL's tile choice (validation/phase2/gen_workload.py --rtl); the other
# networks link to the gemmini mappings. Each change below names its RTL source.
[accelerator]
num_threads=1
num_chips=1
compression_type = dense
input_format = int8
weight_format = int8
output_format = int8

[systolic_array]
# PE configuration
memory_type = separate
# Per-PE streaming row buffer: 512B x 256 PEs = 128KB = the A-operand half of
# Gemmini's 256KB scratchpad.
input_size = 512
weight_size = 64
output_size = 64

# LB7/P1-A: PE local-buffer double buffering is a TIMING property -- it decides whether
# the LB<->MAC transfer hides behind the MAC compute schedule or serializes against it.
# Stated explicitly (the built-in default is 1) so the critical-path contract is not silent.
double_buffer = 1

# V3: Gemmini accumulates outputs in the 64KB array-edge accumulator SRAM (modeled by
# the GLB output partition); per-PE local buffers never hold the output tile.
edge_accumulation = 1

# Fold fill refit on the 6 RTL GEMM points with the RTL tiling, where weights are
# preloaded once per (row tile, column block, K block) and the fold count is I0 x N/16 x
# K/16 (gemmini.cfg's 14 absorbed a fold count missing the I0 factor). Minimax fit:
# compute schedule within 11.8% of the RTL. One fill per fold cannot do better: the RTL's
# per-fold overhead ranges 0.5-32 cycles (validation/phase2/README.md).
weight_fold_fill_cycle = 9.8
layer_setup_cycle = 2270

mac_stationary = weight_stationary
#pe_parameter_order = kbpqcrs

# MAC computation cycle/energy
computation_cycle = 1
computation_energy = 0.56
mac_read_cycle = 1:1:1
mac_read_energy = 0:0:0
mac_write_cycle = 1:1:1
mac_write_energy = 0:0:0
mac_line_size = 8:8:8
# Local buffer read/write cycle/energy
lb_read_cycle = 1.0:1.0:1.0
lb_read_energy = 0.18:0.44:0.33
lb_write_cycle = 1.0:1.0:1.0
lb_write_energy = 0.18:0.51:0.33
lb_line_size = 8:8:8

static_energy = 0.0:0.0:0.0
# transfer cycle between MAC and Local buffer.
transfer_cycle_pe = 1
transfer_energy_pe = 0

# Frequency (MHz) and Bandwidth (MB/sec)
frequency = 500
bandwidth = 8192
bitwidth = 128
line_size = 8:8:8

# PE array configuration
pe_stationary = weight_stationary

# Height and width of PE array
height = 16
width = 16

#exist_temporal_buffer = 1

#PE array read/write cycle/energy
pe_array_read_cycle = 1.0:1.0:1.0
pe_array_read_energy = 0
pe_array_write_cycle = 1.0:1.0:1.0
pe_array_write_energy = 0

# NoC type and unit cycle/energy
noc = bus
noc_cycle = 1
noc_energy = 0

# RTL fabric (Mesh.scala): A enters from the left, B/D from the top and C leaves the
# bottom row, each on its own wires, so the three streams do not share one medium and the
# 16 columns drain their outputs in the same cycle. The MACs consume one operand per
# PE per cycle from their pipeline registers.
writeback_injection_parallel = 1
array_fabric_separate = 1
operand_streams_pipelined = 1

# GLB configuration
[separate]
# Stationary type between GLB and DRAM
stationary_type = output_stationary

# GLB type
memory_type = separate

# GLB buffer size
input_size = 128
weight_size = 128
output_size = 64

# GLB read/write cycle/energy
read_cycle = 1.0:1.0:1.0
read_energy = 3.06:1.07:3.06
write_cycle = 1.0:1.0:1.0
write_energy = 3.00:0.96:3.00
bypass=0:0:0

static_energy = 0.0:0.0:0.0

# Transfer cycle/energy between PE array and GLB
transfer_cycle = 1
transfer_energy = 0

# Frequency (MHz) and Bandwidth(MB/sec)
frequency = 500
bandwidth = 8192
bitwidth = 128
line_size = 128:128:128

# The scratchpad banks and the accumulator are separate SRAMs; the execute, load and store
# controllers access them concurrently (decoupled access/execute).
fabric_separate = 1
streams_pipelined = 1
# WS tiled_matmul_auto double-buffers the scratchpad and the accumulator (gemmini.h:
# double_buffered = WS; tiles sized to half of each), so the next tile loads while the
# current one computes.
double_buffer = 1

[multi_chip]

# DMA: up to max_in_flight_mem_reqs = 16 outstanding memory requests.
max_outstanding_requests = 16

stationary_type = output_stationary

#exist_temporal_buffer = 1
memory_type = shared
memory_size = 256

height = 1
width  = 1

read_cycle = 1.0:1.0:1.0
read_energy = 0.0:0.0:0.0
write_cycle = 1.0:1.0:1.0
write_energy = 0.0:0.0:0.0

static_energy = 0.0:0.0:0.0

frequency = 500
bandwidth = 8192
# L2 <-> SimDRAM AXI port: 64 bits per cycle.
bitwidth = 64
line_size = 128:128:128

noc = bus
noc_cycle = 1
noc_energy = 0

[dram]
# Gemmini DMA in front of the MOSAIC DRAM (used with NPUSIM_MOSAIC_DRAM): 64 B requests, at most
# max_in_flight_mem_reqs = 16 outstanding, and 80 ns of round trip outside the DRAM -- measured on the
# RTL (validation/phase2/dma_latency.c): an L2-missing one-line mvin takes 59 cycles = 118 ns at 500 MHz,
# of which the DDR3 read is 37.5 ns (ddr3_1333_simdram.yaml, single 64 B read).
mosaic_request_bytes = 64
mosaic_max_inflight = 16
mosaic_path_latency_ns = 80
# Stores: mvout writes one 16 B output row (DIM int8) per request; a one-row mvout to an untouched line
# round-trips in 55 cycles = 110 ns (dma_latency.c), all outside the DRAM (Ramulator acks writes on accept).
mosaic_write_request_bytes = 16
mosaic_write_path_latency_ns = 110

dram_config = DRAM/DDR3_8Gb_x16_1600.ini
output_dir = eyeriss_DRAM

# DMA moves one dma_buswidth = 128-bit beat per cycle, and the RTL's SimDRAM backing memory
# keeps up with it (validation/phase2/README.md: the DMA hides fully behind compute). The
# 1-byte lines at 3 cycles each in gemmini.cfg are Eyeriss values.
# Energy per 16-byte line = 16 x gemmini.cfg's per-byte value (same energy per byte).
read_cycle = 1:1:1
read_energy = 1024:1024:1024

write_cycle = 1:1:1
write_energy = 1024:1024:1024

transfer_cycle = 1
transfer_energy = 0

# Frequency (MHz) and Bandwidth (MB/sec)
frequency=500
bandwidth=8192
bitwidth= 128
line_size=128:128:128
