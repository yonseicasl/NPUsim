# E20-3 EVIDENCE FIXTURE, not a design. eyeriss.cfg with conv3: the K factor moved from PE_Y up to the GLB -- the loop bounds and
# total work are unchanged, only the level each factor sits at. It exists to make one
# claim reproducible: conv3's GLB SRAM traffic is 9.2 MB in the shipped mapping, 32.2 MB
# here with K moved up, and 101.2 MB with K and P moved up -- so the Eyeriss chip's
# 50.2 MB IS reachable by a mapping inside this model. An earlier comment in
# validation/phase3/compare.py claimed the opposite ('a missing traffic SOURCE ... no
# mapping choice inside the model can reach the chip's figure') and measuring refuted it.
# The real limit is narrower: these mappings take conv3's computation from 3.83M cycles
# (the chip measures 4.36M) to 15.3M and 199M, so traffic and latency cannot both be
# matched while psum spilling follows the tiling hierarchy rather than GLB capacity.
[accelerator]
input_format = fp16
weight_format = fp16
output_format = fp16
num_threads=1
num_chips=1
compression_type = dense

[spatial_arch]
# V2 (Phase-3 silicon calibration): per weight-element spad-refill exposure.
# Eyeriss JSSC'17 Table V processing latencies fit comp + 0.13 x (weight events
# x per-PE weight elements) with zero per-layer setup (all 5 conv layers <= 4.5%).
weight_fold_fill_cycle = 0.11
# PE configuration
memory_type = separate
input_size = 24
weight_size = 448
output_size = 48

# LB7/P1-A: PE local-buffer double buffering is a TIMING property -- it decides whether
# the LB<->MAC transfer hides behind the MAC compute schedule or serializes against it.
# Stated explicitly (the built-in default is 1) so the critical-path contract is not silent.
double_buffer = 1

mac_stationary = weight_stationary
#pe_parameter_order = kbpqcrs

# MAC computation cycle/energy
computation_cycle = 1
computation_energy = 0.56
mac_read_cycle = 1:1:1
mac_read_energy = 0:0:0
mac_write_cycle = 1:1:1
mac_write_energy = 0:0:0
mac_line_size = 8:8:8
# Local buffer read/write cycle/energy
lb_read_cycle = 1.0:1.0:1.0
lb_read_energy = 0.18:0.44:0.33
lb_write_cycle = 1.0:1.0:1.0
lb_write_energy = 0.18:0.51:0.33
lb_line_size = 8:8:8

static_energy = 0.0:0.0:0.0
# transfer cycle between MAC and Local buffer.
transfer_cycle_pe = 1
transfer_energy_pe = 0

# Frequency (MHz) and Bandwidth (MB/sec)
frequency = 200
bandwidth = 8192
bitwidth = 256
line_size = 8:8:8

# PE array configuration
pe_stationary = weight_stationary

# Height and width of PE array
height = 12
width = 14

#exist_temporal_buffer = 1

#PE array read/write cycle/energy
pe_array_read_cycle = 1.0:1.0:1.0
pe_array_read_energy = 0
pe_array_write_cycle = 1.0:1.0:1.0
pe_array_write_energy = 0

# NoC type and unit cycle/energy
noc = bus
noc_cycle = 1
noc_energy = 0

# GLB configuration
[shared]
# Stationary type between GLB and DRAM
stationary_type = output_stationary

# GLB type
memory_type = shared

# GLB buffer size
memory_size = 108

# GLB read/write cycle/energy
read_cycle = 1.0:1.0:1.0
read_energy = 3.06:1.07:3.06
write_cycle = 1.0:1.0:1.0
write_energy = 3.00:0.96:3.00
bypass=0:1:0

static_energy = 0.0:0.0:0.0

# Transfer cycle/energy between PE array and GLB
transfer_cycle = 1
transfer_energy = 0

# Frequency (MHz) and Bandwidth(MB/sec)
frequency = 200
bandwidth = 8192
bitwidth = 256
line_size = 8:8:8

[multi_chip]

stationary_type = output_stationary

#exist_temporal_buffer = 1
memory_type = shared
memory_size = 108

height = 1
width  = 1

read_cycle = 1.0:1.0:1.0
read_energy = 0.0:0.0:0.0
write_cycle = 1.0:1.0:1.0
write_energy = 0.0:0.0:0.0

static_energy = 0.0:0.0:0.0

frequency = 200
bandwidth = 8192
bitwidth = 256
line_size = 8:8:8

noc = bus
noc_cycle = 1
noc_energy = 0

[dram]

dram_config = DRAM/DDR3_8Gb_x16_1600.ini
output_dir = eyeriss_DRAM

read_cycle = 3:3:3
read_energy = 64:64:64

write_cycle = 3:3:3
write_energy = 64:64:64

transfer_cycle = 3
transfer_energy = 0

# Frequency (MHz) and Bandwidth (MB/sec)
frequency=200
bandwidth=8192
bitwidth= 64
line_size=8:8:8
