[accelerator]
num_threads=1
num_chips=1
compression_type = dense
input_format = int8
weight_format = int8
output_format = int8

[systolic_array]
# PE configuration
memory_type = separate
# Per-PE streaming row buffer: 512B x 256 PEs = 128KB = the A-operand half of
# Gemmini's 256KB scratchpad.
input_size = 512
weight_size = 64
output_size = 64

# LB7/P1-A: PE local-buffer double buffering is a TIMING property -- it decides whether
# the LB<->MAC transfer hides behind the MAC compute schedule or serializes against it.
# Stated explicitly (the built-in default is 1) so the critical-path contract is not silent.
double_buffer = 1

# V3: Gemmini accumulates outputs in the 64KB array-edge accumulator SRAM (modeled by
# the GLB output partition); per-PE local buffers never hold the output tile.
edge_accumulation = 1

# V2: RTL-calibrated weight-residency fold fill. Gemmini RTL (Verilator, 6 GEMM points)
# measures ~14 cycles of load/accumulate-drain bubble per array-wide weight residency
# and ~2270 cycles of per-layer setup (config/flush/DMA prologue).
weight_fold_fill_cycle = 14
layer_setup_cycle = 2270

mac_stationary = weight_stationary
#pe_parameter_order = kbpqcrs

# MAC computation cycle/energy
computation_cycle = 1
computation_energy = 0.56
mac_read_cycle = 1:1:1
mac_read_energy = 0:0:0
mac_write_cycle = 1:1:1
mac_write_energy = 0:0:0
mac_line_size = 8:8:8
# Local buffer read/write cycle/energy
lb_read_cycle = 1.0:1.0:1.0
lb_read_energy = 0.18:0.44:0.33
lb_write_cycle = 1.0:1.0:1.0
lb_write_energy = 0.18:0.51:0.33
lb_line_size = 8:8:8

static_energy = 0.0:0.0:0.0
# transfer cycle between MAC and Local buffer.
transfer_cycle_pe = 1
transfer_energy_pe = 0

# Frequency (MHz) and Bandwidth (MB/sec)
frequency = 200
bandwidth = 8192
bitwidth = 128
line_size = 8:8:8

# PE array configuration
pe_stationary = weight_stationary

# Height and width of PE array
height = 16
width = 16

#exist_temporal_buffer = 1

#PE array read/write cycle/energy
pe_array_read_cycle = 1.0:1.0:1.0
pe_array_read_energy = 0
pe_array_write_cycle = 1.0:1.0:1.0
pe_array_write_energy = 0

# NoC type and unit cycle/energy
noc = bus
noc_cycle = 1
noc_energy = 0

# GLB configuration
[separate]
# Stationary type between GLB and DRAM
stationary_type = output_stationary

# GLB type
memory_type = separate

# GLB buffer size
input_size = 128
weight_size = 128
output_size = 64

# GLB read/write cycle/energy
read_cycle = 1.0:1.0:1.0
read_energy = 3.06:1.07:3.06
write_cycle = 1.0:1.0:1.0
write_energy = 3.00:0.96:3.00
bypass=0:0:0

static_energy = 0.0:0.0:0.0

# Transfer cycle/energy between PE array and GLB
transfer_cycle = 1
transfer_energy = 0

# Frequency (MHz) and Bandwidth(MB/sec)
frequency = 200
bandwidth = 8192
bitwidth = 128
line_size = 128:128:128

[multi_chip]

stationary_type = output_stationary

#exist_temporal_buffer = 1
memory_type = shared
memory_size = 256

height = 1
width  = 1

read_cycle = 1.0:1.0:1.0
read_energy = 0.0:0.0:0.0
write_cycle = 1.0:1.0:1.0
write_energy = 0.0:0.0:0.0

static_energy = 0.0:0.0:0.0

frequency = 200
bandwidth = 8192
bitwidth = 128
line_size = 128:128:128

noc = bus
noc_cycle = 1
noc_energy = 0

[dram]

dram_config = DRAM/DDR3_8Gb_x16_1600.ini
output_dir = eyeriss_DRAM

read_cycle = 3:3:3
read_energy = 64:64:64

write_cycle = 3:3:3
write_energy = 64:64:64

transfer_cycle = 3
transfer_energy = 0

# Frequency (MHz) and Bandwidth (MB/sec)
frequency=200
bandwidth=8192
bitwidth= 64
line_size=8:8:8

[kvcache]
kv_bytes_per_token = 1024
context_length = 65536
kv_compression_ratio = 1
kvcache_read_energy = 0.02
