# tpu_v4.cfg with int8 weights. Google TPU v4, one chip (refs/tpu/README.md): 2 TensorCores x 4 MXUs of 128x128 bf16 = 8 MXUs,
# 1050 MHz (8 x 128^2 x 2 x 1.05 GHz = 275 TFLOPS, the published peak), HBM2 32 GiB at 1200 GB/s,
# VMEM 32 MiB. Each MXU is one NPUsim chip ([multi_chip] 8 x 1); the HBM is the shared [dram].
# Built for the PaLM decode comparison (validation/palm/); no TPU golden calibrates its unit
# costs, so the weight fold fill and layer setup are 0 and a 128x128 weight tile is shifted in
# by the array's weight stream (one 128-element row per cycle). tpu_v4_int8w.cfg differs only
# in weight_format (int8 weights, bf16 activations: Pope et al. 2023's low-latency setup).
[accelerator]
num_threads=1
num_chips=8
compression_type = dense
input_format = bf16
weight_format = int8
output_format = bf16
accumulator_format = fp32

[systolic_array]
memory_type = separate
# Per-PE operand buffers (bytes): a fold streams up to 512 bf16 rows of activations.
input_size = 2048
weight_size = 64
output_size = 64
double_buffer = 1
# MXU outputs accumulate in the accumulators at the array edge.
edge_accumulation = 1
weight_fold_fill_cycle = 0
layer_setup_cycle = 0

mac_stationary = weight_stationary
computation_cycle = 1
computation_energy = 0
mac_read_cycle = 1:1:1
mac_read_energy = 0:0:0
mac_write_cycle = 1:1:1
mac_write_energy = 0:0:0
mac_line_size = 16:16:16
lb_read_cycle = 1.0:1.0:1.0
lb_read_energy = 0:0:0
lb_write_cycle = 1.0:1.0:1.0
lb_write_energy = 0:0:0
lb_line_size = 16:16:16
static_energy = 0.0:0.0:0.0
transfer_cycle_pe = 1
transfer_energy_pe = 0

frequency = 1050
bandwidth = 268800
# One 128-element bf16 row per cycle into or out of the array.
bitwidth = 2048
line_size = 16:16:16

pe_stationary = weight_stationary
height = 128
width = 128
pe_array_read_cycle = 1.0:1.0:1.0
pe_array_read_energy = 0
pe_array_write_cycle = 1.0:1.0:1.0
pe_array_write_energy = 0
noc = bus
noc_cycle = 1
noc_energy = 0
writeback_injection_parallel = 1
array_fabric_separate = 1
operand_streams_pipelined = 1
# The MXU's weight registers are double-buffered: the next 128x128 tile shifts in while the
# current one computes, and rows stream fold after fold without draining the wavefront.
streams_pipelined = 1

# VMEM share of one MXU (KB). The activation partition holds the whole per-chip activation,
# which the 8 MXUs read from one VMEM copy (inputs are identical across the output-column
# split); weights stream through in 128-column strips.
[separate]
stationary_type = output_stationary
memory_type = separate
input_size = 24576
weight_size = 4096
output_size = 2048
read_cycle = 1.0:1.0:1.0
read_energy = 0:0:0
write_cycle = 1.0:1.0:1.0
write_energy = 0:0:0
bypass=0:0:0
static_energy = 0.0:0.0:0.0
transfer_cycle = 1
transfer_energy = 0
frequency = 1050
bandwidth = 537600
# The MXU result path into its accumulators moves one 128-wide fp32 vector per cycle (4096 bits);
# the accumulators are modeled by the output partition, so the port is that wide.
bitwidth = 4096
line_size = 4096:4096:4096
fabric_separate = 1
streams_pipelined = 1
double_buffer = 1

# HBM -> VMEM DMA staging, fanned out to the 8 MXUs. The DMA double-buffers: the next strip
# lands while the current one is consumed, so the staging writes do not serialize.
[multi_chip]
double_buffer = 1
max_outstanding_requests = 16
stationary_type = output_stationary
memory_type = shared
memory_size = 131072
height = 8
width  = 1
read_cycle = 1.0:1.0:1.0
read_energy = 0.0:0.0:0.0
write_cycle = 1.0:1.0:1.0
write_energy = 0.0:0.0:0.0
static_energy = 0.0:0.0:0.0
frequency = 1050
bandwidth = 1075200
bitwidth = 8192
line_size = 8192:8192:8192
noc = bus
noc_cycle = 1
noc_energy = 0

# HBM2, 1200 GB/s = 1143 B per 1050 MHz cycle: one 1 KB line per 0.896 cycle.
[dram]
read_cycle = 0.896:0.896:0.896
read_energy = 0:0:0
write_cycle = 0.896:0.896:0.896
write_energy = 0:0:0
transfer_cycle = 0.896
transfer_energy = 0
frequency=1050
bandwidth=1200000
bitwidth= 8192
line_size=8192:8192:8192
