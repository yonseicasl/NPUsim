# NVDLA nv_small first-pass architectural mapping for NPUsim.
#
# Source of truth: nvdla/hw master @1a65f1f5b48268accaa47c95f95c2601918be095,
# spec/defs/nv_small.spec (see validation/nvdla/PROVENANCE.md).
#
# This is a FIRST-PRINCIPLES config built from nv_small's published architecture
# parameters, NOT fitted/back-solved to match any RTL cycle count. Where NPUsim's
# component model has no direct NVDLA analog (CDMA/CSC/CMAC/CACC pipeline
# fill/drain, SDP pass-through latency, CSB register-programming overhead), a
# conservative 1-cycle default is used and called out as unmodeled in
# validation/nvdla/README.md -- do not read this file's absence of those knobs as
# "NPUsim has verified they don't matter."
#
# NPUsim <-> NVDLA component boundary mapping (assessment/NVDLA_RTL_FIDELITY_PLAN_2026-08-20.md Sec 5.3):
#   PE array (height x width)      <-> CMAC/CSC: Atomic-K x Atomic-C = 8 x 8 = 64 INT8 MAC
#   shared-section global buffer         <-> CBUF: 32 banks x 8B x 512 entries = 128 KiB
#   dram-section                          <-> DBBIF primary memory interface: 64-bit, fixed 64-cycle
#                                       read latency (nv_small.spec PRIMARY_MEMIF_LATENCY_64)
#
# NOT modeled by this first-pass config (see plan Sec 5.3 caveat -- CBUF holds
# input+weight, CACC is a separate accumulator, NPUsim's single GLB level is a
# simplification of that split):
#   - CACC accumulator as a structure distinct from CBUF
#   - SDP/PDP/CDP post-processing pass-through latency
#   - CSB register-programming cost (this run's RTL golden cycle count also
#     includes CSB programming -- see validation/nvdla/README.md boundary note)

[accelerator]
# nvdla_small_cacti22: the energy-calibrated variant of nvdla_small.cfg (timing model
# identical). CALIBRATED components, each traceable to validation/phase4:
#   CBUF SRAM  -- CACTI 7 @22nm for the nv_ram_rws_256x64 bank macro (2048 B, 64 b
#                 access): 0.6911/1.0221 pJ read/write; the 512 b weight line reads
#                 8 banks in parallel -> 8x per access. Leakage per declared partition
#                 (macros x 0.8038 mW at 1000 MHz = pJ/cycle).
#   CACC RAM   -- CACTI 7 @22nm for nv_ram_rws_16x256 (512 B; CACTI accepts a 128 b
#                 bus for this geometry, consumed PER BYTE): read 0.0469 / write
#                 0.0591 pJ/B; the single per-byte accumulator knob covers both
#                 directions with their mean 0.0530 (reload/spill byte counts are
#                 near-equal, so the mean is faithful to the sum).
#   DBBIF/DRAM -- DRAMsim3 DDR3_8Gb_x16_1600 JEDEC IDD: 56.5312 pJ/B x 8 B beat
#                 = 452.25 pJ per access (same derivation as gemmini_cacti22).
# NOT calibrated and deliberately UNDECLARED (the unpriced/undercount machinery must
# fire, and does): MAC compute, operand-register file, CMAC adder tree, per-stripe
# and layer-setup control, NoC wire energy, CACC delivery buffer (544 B geometry not
# accepted by CACTI), MCIF FIFOs (outside the model's structure), clock network.
# The RTL is TSMC16FFLR; 22 nm is the nearest CACTI node -- the mismatch is stated,
# exactly as gemmini_cacti22 states it.
energy_unit = pJ
energy_reference = on-chip SRAM (CBUF bank, CACC assembly) from CACTI 7 commit 1ffd8dfb @22nm itrs-hp 360K for the RTL macro geometries; DRAM from DRAMsim3 DDR3_8Gb_x16_1600 JEDEC IDD model (validation/phase4/PROVENANCE.md); MAC/registers/adder-tree/control NOT calibrated and undeclared
num_threads=1
num_chips=1
compression_type = dense

[spatial_arch]
memory_type = separate
input_size = 8
weight_size = 8
output_size = 8

mac_stationary = weight_stationary

# One INT8 MAC per PE per cycle -- nv_small does not publish additional
# per-atomic-op MAC latency beyond the 1 op/cycle/lane microarchitecture.
computation_cycle = 1

# 2026-08-26: one-time per-layer pipeline constant, decomposed by provenance
# (validation/nvdla/measure_pipeline_constants.py):
#   launch  28 cycles -- CDMA D_OP_ENABLE accept -> first DBB read request.
#                        EXACTLY constant on all 13 conv traces (structural).
#   mem_lat 32 cycles -- first read request -> first read data. EXACTLY constant
#                        on all 14 traces AND independently derivable from the
#                        harness source (AXIResponder AXI_R_LATENCY=32): the DBB
#                        is a fixed-latency 1-beat/cycle stream, so its latency
#                        is paid once per layer, not per beat.
#   drain   77 cycles -- last read data -> last output write: the CBUF->CSC->
#                        CMAC->CACC->SDP->WDMA pipe depth. CALIBRATED on the one
#                        trace whose compute tail is zero (dc_1x1x8_1x1x8x1,
#                        n=1); that trace therefore LEAVES the cycle holdout set
#                        and is reported as a calibration point.
# Every other trace's drain gap mixes in the compute tail and is NOT a pipe
# depth; see the measurement script's docstring.
layer_setup_cycle = 137

# 2026-08-26: per-stripe schedule bubble -- one fixed cost per legacy (C-group, r, s)
# reduction slice per output row (model: overhead = B * ceil(C/8)*R*S*Ho; the count
# comes from mapping_table_t::stripe_transition_count()). CALIBRATED: B fitted by
# least squares on {dc_13x15x64, dc_32x26x76 K16, dc_32x26x76 K270, dc_8x16x128}
# ONLY; holdout {dc_14x7x49, dc_24x44x14, dc_35x22x54} gives MAPE 0.54% / max 0.75%
# (validation/nvdla/calibrate_stripe_overhead.py). Kg-independence is a MEASURED
# property (the K16/K270 twin: 17x the weight blocks, near-identical residual).
# Scope: stride-1, dilation-1 direct conv; other regimes documented in the script.
stripe_transition_cycle = 4.356
mac_read_cycle = 1:1:1
mac_write_cycle = 1:1:1
mac_line_size = 8:8:8
# CACC assembly RAM, per byte (see header): mean of CACTI read/write per-byte.
accumulator_spill_energy = 0:0:0.0530

lb_read_cycle = 1.0:1.0:1.0
lb_write_cycle = 1.0:1.0:1.0
lb_line_size = 8:8:8

static_energy = 0.0:0.0:0.0
# 2026-08-26: the MAC operands are per-lane registers loaded in lockstep with compute --
# the RTL sustains 1 op/lane/cycle with no exposed per-op transfer time. Charged as
# energy/transactions only; the cycle side rides the compute pipeline (see pe.h).
operand_streams_pipelined = 1
transfer_cycle_pe = 1

frequency = 1000
bandwidth = 8000
# 2026-08-26: intra-array link width = the widest stream's bus, the 512 b CSC weight
# bus (a full 64 B atomic-kernel slice per cycle). The dat (64 b) and accu streams
# already move at most one line per transfer, so their transaction counts are
# unchanged by this width; with array_fabric_separate the axis maxes per stream.
bitwidth = 512
# Per-datatype transfer granularity. dat: one 8 B atom per cycle (64 b). wt: the CSC
# weight bus moves a full 64 B atomic-kernel slice per cycle (512 b; sc2mac_wt_a/b are
# 32 B each, delivered the same cycle). out: 8 B accumulator atoms.
line_size = 64:512:64

# CORRECTED 2026-08-26 (was weight_stationary). This key is the ordering authority for
# the array <-> CBUF loops (the scheduler computes the legacy-GLB offset sequence from
# it), and nv_small's CSC completes each output stripe's reduction -- all (r, s,
# C-group) slices -- before advancing to the next stripe, holding the partial sums in
# CACC at the array edge. That is OUTPUT-stationary ordering at this level; weights are
# re-read from CBUF per stripe (CBUF-resident, matching the measured fetch-once DBB
# weight traffic). The per-lane weight hold DURING a stripe is mac_stationary above,
# a different level. Under the old value the model spilled every partial sum through
# the GLB -- traffic the RTL never performs -- which inflated the critical path ~70x.
pe_stationary = output_stationary

# Atomic-K=8 x Atomic-C=8 = 64 INT8 MAC (nv_small.spec MAC_ATOMIC_K_SIZE_8 /
# MAC_ATOMIC_C_SIZE_8). width = K-direction lanes, height = C-direction lanes.
height = 8
width = 8

pe_array_read_cycle = 1.0:1.0:1.0
pe_array_write_cycle = 1.0:1.0:1.0

noc = bus
noc_cycle = 1

# 2026-08-26 (array streaming granularity): the CSC<->CMAC/CACC fabric is not one
# shared serialized bus. Three structural facts, each read off the RTL's own ports:
#   * the write-back is DEDICATED per-lane wiring into the CMAC adder tree / mac2accu
#     bus (the VCD's per-lane sc2mac/mac2accu signals fire in the same cycle), so the
#     per-PE streams overlap in time; every wire traversal still costs its
#     transaction/energy.
#   * dat, wt and accu ride SEPARATE buses -- the link busy axis maxes across streams.
#   * the wt bus delivers a full 64 B atomic-kernel slice per cycle; dat one 8 B atom
#     per cycle (line_size above).
# NOT yet priced: the CMAC adder-tree reduction energy (all NVDLA energies are 0 until
# the energy phase); its cycle cost is pipelined (the RTL sustains 1 stripe op/cycle).
writeback_injection_parallel = 1
array_fabric_separate = 1

# CBUF: 32 banks x 8B x 512 entries = 128 KiB. Simplified as one shared buffer;
# NPUsim does not separately model CBUF's input/weight bank partition or the
# CACC accumulator as a distinct structure (see plan Sec 5.3).
# 2026-08-26: converted shared -> separate. nv_small's CBUF is not one shared port:
# D_BANK partitions the 32 banks into disjoint data and weight regions and CSC's dat
# and wt loaders read them CONCURRENTLY (separate sc2buf channels). The shared-port
# model serialized the two reads (T10 sum rule) into a spurious 2x access axis. The
# static split below approximates the per-layer D_BANK programming: it covers every
# validated trace's resident working set (largest input union 66,560 B; weight tiles
# are array-sized). The RTL re-partitions per layer; a static config cannot.
[separate]
stationary_type = output_stationary
memory_type = separate
input_size = 68
weight_size = 52
output_size = 8

read_cycle = 1.0:1.0:1.0
# CACTI bank macro per access; wt line = 8 banks in parallel (512 b).
read_energy = 0.6911:5.5288:0.6911
write_cycle = 1.0:1.0:1.0
write_energy = 1.0221:8.1768:1.0221
# CORRECTED 2026-08-26 (was 0:1:0, inherited from the Eyeriss template, which streams
# filter weights past its GLB). nv_small's weights are CBUF-RESIDENT: CDMA_WT writes
# them into the D_BANK weight partition once (the measured fetch-once DBB traffic) and
# CSC re-reads them from CBUF per stripe. Bypassing them mis-attributed every on-chip
# weight stream to the chip ingress instead of the CBUF SRAM.
bypass=0:0:0

# CBUF leakage per declared partition: ceil(KB/2) bank macros x 0.8038 mW @1000 MHz
# (= pJ/cycle at the 1000 MHz clock): input 34, weight 26, output 4 macros.
static_energy = 27.3292:20.8988:3.2152
transfer_cycle = 1
transfer_energy = 0

frequency = 1000
bandwidth = 8000
# 2026-08-26: the CBUF -> CSC read path is not one 8 B bank port. CSC's weight loader
# consumes a full 64 B atomic-kernel slice per cycle (the same width its sc2mac wt bus
# then carries), served by the banked array in parallel; dat reads one 8 B atom per
# cycle. Modeling the interface at the single-bank width serialized every weight fetch
# 8x against the RTL. Bank width itself (8 B, CBUF_BANK_WIDTH_8) still governs the
# per-access granularity of the dat/out streams via line_size.
bitwidth = 512
line_size = 64:512:64

# The CBUF -> CSC dat and wt streams ride separate physical channels out of disjoint
# D_BANK partitions -- concurrent, so the fabric's busy axis maxes across streams.
fabric_separate = 1
# Consecutive per-pass transfers pipeline at one beat/cycle (the CBUF read and the
# fabric stream); the packet fill amortizes across the stream rather than re-paying
# on every 1-beat transfer.
streams_pipelined = 1

[multi_chip]
stationary_type = output_stationary
memory_type = shared
memory_size = 128

# The DBBIF accepts a request every cycle and the harness pipelines responses
# 1/beat (see the dram section correction note): the DRAM <-> multi-chip boundary is
# deeply pipelined, not single-buffered. MC2's outstanding-request knob models
# exactly this; 128 is the harness's practical depth (never back-pressures).
max_outstanding_requests = 128

height = 1
width  = 1

read_cycle = 1.0:1.0:1.0
read_energy = 0.0:0.0:0.0
write_cycle = 1.0:1.0:1.0
write_energy = 0.0:0.0:0.0

static_energy = 0.0:0.0:0.0

frequency = 1000
bandwidth = 8000
bitwidth = 64
# num_chips=1 here, so multi-chip NoP is a pass-through; kept consistent with
# the 64-bit atomic size to avoid introducing a spurious byte-wise split.
line_size = 64:64:64

noc = bus
noc_cycle = 1
noc_energy = 0

# DBBIF primary memory interface: 64-bit (nv_small.spec PRIMARY_MEMIF_WIDTH_64).
#
# CORRECTED 2026-08-25. The first-pass config set read_cycle=64 from
# PRIMARY_MEMIF_LATENCY_64 -- a MISREADING. That spec field sizes the CDMA/MCIF
# response FIFOs for an EXPECTED round-trip latency; it is not a per-beat
# occupancy. The golden environment's memory model (verif/verilator/nvdla.cpp
# AXIResponder) is a fixed ~33-cycle-latency, 1-beat-per-cycle STREAM: r0_fifo
# is pre-filled with AXI_R_LATENCY=32 bubbles and advances one entry per cycle,
# and requests are accepted every cycle. Charging 64 cycles of occupancy per 8B
# beat serialized the whole stream and overstated the DRAM axis ~50x on
# memory-heavy traces. Per-beat occupancy is 1 cycle at the modeled clock; the
# one-time ~33-cycle pipe-fill latency has no dedicated NPUsim knob and is a
# documented unmodeled term (significant only for tiny traces -- ~20% of the
# 169-cycle micro-trace, amortized away on every calibration-scale trace).
[dram]
dram_config = DRAM/DDR3_8Gb_x16_1600.ini
output_dir = nvdla_small_DRAM

read_cycle = 1:1:1
# DRAMsim3 DDR3-1600: 56.5312 pJ/B x 8 B beat.
read_energy = 452.25:452.25:452.25

write_cycle = 1:1:1
write_energy = 452.25:452.25:452.25

transfer_cycle = 1
transfer_energy = 0

frequency=1000
bandwidth=8000
bitwidth=64
# Primary memory interface atomic size: 64-bit/8B (nv_small.spec
# PRIMARY_MEMIF_WIDTH_64), max burst length 1 beat (PRIMARY_MEMIF_MAX_BURST_
# LENGTH_1) -- each DBBIF transaction is exactly one 8-byte beat, matching the
# RTL golden run (16 separate 8B weight reads, not one wide burst).
line_size=64:64:64
