# Gemmini-style accelerator with an opt-in Special Function Unit (plan/plan_sfu.md).
#
# This config is SEPARATE from the gemmini.cfg baseline on purpose: the plan requires
# SFU-disabled baselines to keep their numeric results, so the SFU is enabled only here.
#
# SFU profile provenance: PLACEHOLDER values for development and formula validation.
# The latency/II/energy numbers below are NOT RTL- or silicon-calibrated (Phase 8 targets
# NVDLA SDP for calibration); no energy_unit is declared, so all energy remains an
# ESTIMATED relative sum and absolute power stays unqualified.

[accelerator]
num_threads=1
num_chips=1
compression_type = dense
input_format = int8
weight_format = int8
output_format = int8

[systolic_array]
# PE configuration
memory_type = separate
input_size = 512
weight_size = 64
output_size = 64
double_buffer = 1
edge_accumulation = 1
weight_fold_fill_cycle = 14
layer_setup_cycle = 2270

mac_stationary = weight_stationary

computation_cycle = 1
computation_energy = 0.56
mac_read_cycle = 1:1:1
mac_read_energy = 0:0:0
mac_write_cycle = 1:1:1
mac_write_energy = 0:0:0
mac_line_size = 8:8:8
lb_read_cycle = 1.0:1.0:1.0
lb_read_energy = 0.18:0.44:0.33
lb_write_cycle = 1.0:1.0:1.0
lb_write_energy = 0.18:0.51:0.33
lb_line_size = 8:8:8

static_energy = 0.0:0.0:0.0
transfer_cycle_pe = 1
transfer_energy_pe = 0

frequency = 200
bandwidth = 8192
bitwidth = 128
line_size = 8:8:8

pe_stationary = weight_stationary
height = 16
width = 16

pe_array_read_cycle = 1.0:1.0:1.0
pe_array_read_energy = 0
pe_array_write_cycle = 1.0:1.0:1.0
pe_array_write_energy = 0

noc = bus
noc_cycle = 1
noc_energy = 0

[separate]
stationary_type = output_stationary
memory_type = separate
input_size = 128
weight_size = 128
output_size = 64

read_cycle = 1.0:1.0:1.0
read_energy = 3.06:1.07:3.06
write_cycle = 1.0:1.0:1.0
write_energy = 3.00:0.96:3.00
bypass=0:0:0

static_energy = 0.0:0.0:0.0
transfer_cycle = 1
transfer_energy = 0

frequency = 200
bandwidth = 8192
bitwidth = 128
line_size = 128:128:128

[multi_chip]
stationary_type = output_stationary
memory_type = shared
memory_size = 256
height = 1
width  = 1

read_cycle = 1.0:1.0:1.0
read_energy = 0.0:0.0:0.0
write_cycle = 1.0:1.0:1.0
write_energy = 0.0:0.0:0.0

static_energy = 0.0:0.0:0.0
frequency = 200
bandwidth = 8192
bitwidth = 128
line_size = 128:128:128

noc = bus
noc_cycle = 1
noc_energy = 0

[dram]
dram_config = DRAM/DDR3_8Gb_x16_1600.ini
output_dir = eyeriss_DRAM

read_cycle = 3:3:3
read_energy = 64:64:64
write_cycle = 3:3:3
write_energy = 64:64:64
transfer_cycle = 3
transfer_energy = 0

frequency=200
bandwidth=8192
bitwidth= 64
line_size=8:8:8

# Special Function Unit: post-accumulator activation datapath (plan/plan_sfu.md).
# STREAMING fixture: queue_depth = 2 lets the SFU overlap the producer through a bounded
# output-tile queue (Phase 5); softmax operands stream via the default dram residency.
# One 16-lane pipeline per chip, streaming (queue_depth = 2) contract, fused with the
# output path (no intermediate tensor materialization, no extra DRAM traffic).
[sfu]
num_units_per_chip = 1
lanes = 16
queue_depth = 2
placement = post_accumulator
fusion = fused
setup_cycle = 0

# Element-wise activation profiles (latency to first result / initiation interval).
# PLACEHOLDER, uncalibrated: single-cycle piecewise-linear ops, longer LUT/polynomial
# pipelines for the transcendental ops.
relu_pipeline_latency = 1
relu_initiation_interval = 1
leaky_pipeline_latency = 2
leaky_initiation_interval = 1
elu_pipeline_latency = 6
elu_initiation_interval = 1
sigmoid_pipeline_latency = 6
sigmoid_initiation_interval = 1
tanh_pipeline_latency = 6
tanh_initiation_interval = 1
hsigmoid_pipeline_latency = 2
hsigmoid_initiation_interval = 1
hswish_pipeline_latency = 3
hswish_initiation_interval = 1
gelu_pipeline_latency = 8
gelu_initiation_interval = 1
silu_pipeline_latency = 7
silu_initiation_interval = 1

# Softmax micro-operation profiles (max -> subtract -> exp -> sum -> reciprocal ->
# normalize multi-pass microprogram).
exp_pipeline_latency = 6
exp_initiation_interval = 1
recip_pipeline_latency = 8
recip_initiation_interval = 2
vmax_pipeline_latency = 1
vmax_initiation_interval = 1
vadd_pipeline_latency = 1
vadd_initiation_interval = 1
vmul_pipeline_latency = 2
vmul_initiation_interval = 1

# Per-operation dynamic energy (per valid element) and internal access costs.
# PLACEHOLDER, uncalibrated.
sfu_op_energy_relu = 0.10
sfu_op_energy_leaky = 0.18
sfu_op_energy_elu = 0.60
sfu_op_energy_sigmoid = 0.60
sfu_op_energy_tanh = 0.60
sfu_op_energy_hsigmoid = 0.20
sfu_op_energy_hswish = 0.30
sfu_op_energy_gelu = 0.90
sfu_op_energy_silu = 0.80
sfu_op_energy_exp = 0.60
sfu_op_energy_recip = 0.70
sfu_op_energy_vmax = 0.08
sfu_op_energy_vadd = 0.08
sfu_op_energy_vmul = 0.15
sfu_read_energy = 0.02
sfu_write_energy = 0.02
sfu_setup_energy = 0.00
sfu_static_energy = 0.001
