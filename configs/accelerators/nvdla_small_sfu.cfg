# NVDLA nv_small first-pass architectural mapping for NPUsim.
#
# Source of truth: nvdla/hw master @1a65f1f5b48268accaa47c95f95c2601918be095,
# spec/defs/nv_small.spec (see validation/nvdla/PROVENANCE.md).
#
# This is a FIRST-PRINCIPLES config built from nv_small's published architecture
# parameters, NOT fitted/back-solved to match any RTL cycle count. Where NPUsim's
# component model has no direct NVDLA analog (CDMA/CSC/CMAC/CACC pipeline
# fill/drain, SDP pass-through latency, CSB register-programming overhead), a
# conservative 1-cycle default is used and called out as unmodeled in
# validation/nvdla/README.md -- do not read this file's absence of those knobs as
# "NPUsim has verified they don't matter."
#
# NPUsim <-> NVDLA component boundary mapping (assessment/NVDLA_RTL_FIDELITY_PLAN_2026-08-20.md Sec 5.3):
#   PE array (height x width)      <-> CMAC/CSC: Atomic-K x Atomic-C = 8 x 8 = 64 INT8 MAC
#   [shared] global buffer         <-> CBUF: 32 banks x 8B x 512 entries = 128 KiB
#   [dram]                          <-> DBBIF primary memory interface: 64-bit, fixed 64-cycle
#                                       read latency (nv_small.spec PRIMARY_MEMIF_LATENCY_64)
#
# NOT modeled by this first-pass config (see plan Sec 5.3 caveat -- CBUF holds
# input+weight, CACC is a separate accumulator, NPUsim's single GLB level is a
# simplification of that split):
#   - CACC accumulator as a structure distinct from CBUF
#   - SDP/PDP/CDP post-processing pass-through latency
#   - CSB register-programming cost (this run's RTL golden cycle count also
#     includes CSB programming -- see validation/nvdla/README.md boundary note)

[accelerator]
num_threads=1
num_chips=1
compression_type = dense

[spatial_arch]
memory_type = separate
input_size = 8
weight_size = 8
output_size = 8

mac_stationary = weight_stationary

# One INT8 MAC per PE per cycle -- nv_small does not publish additional
# per-atomic-op MAC latency beyond the 1 op/cycle/lane microarchitecture.
computation_cycle = 1

# 2026-08-26: one-time per-layer pipeline constant, decomposed by provenance
# (validation/nvdla/measure_pipeline_constants.py):
#   launch  28 cycles -- CDMA D_OP_ENABLE accept -> first DBB read request.
#                        EXACTLY constant on all 13 conv traces (structural).
#   mem_lat 32 cycles -- first read request -> first read data. EXACTLY constant
#                        on all 14 traces AND independently derivable from the
#                        harness source (AXIResponder AXI_R_LATENCY=32): the DBB
#                        is a fixed-latency 1-beat/cycle stream, so its latency
#                        is paid once per layer, not per beat.
#   drain   77 cycles -- last read data -> last output write: the CBUF->CSC->
#                        CMAC->CACC->SDP->WDMA pipe depth. CALIBRATED on the one
#                        trace whose compute tail is zero (dc_1x1x8_1x1x8x1,
#                        n=1); that trace therefore LEAVES the cycle holdout set
#                        and is reported as a calibration point.
# Every other trace's drain gap mixes in the compute tail and is NOT a pipe
# depth; see the measurement script's docstring.
layer_setup_cycle = 137
layer_setup_energy = 0

# 2026-08-26: per-stripe schedule bubble -- one fixed cost per legacy (C-group, r, s)
# reduction slice per output row (model: overhead = B * ceil(C/8)*R*S*Ho; the count
# comes from mapping_table_t::stripe_transition_count()). CALIBRATED: B fitted by
# least squares on {dc_13x15x64, dc_32x26x76 K16, dc_32x26x76 K270, dc_8x16x128}
# ONLY; holdout {dc_14x7x49, dc_24x44x14, dc_35x22x54} gives MAPE 0.54% / max 0.75%
# (validation/nvdla/calibrate_stripe_overhead.py). Kg-independence is a MEASURED
# property (the K16/K270 twin: 17x the weight blocks, near-identical residual).
# Scope: stride-1, dilation-1 direct conv; other regimes documented in the script.
stripe_transition_cycle = 4.356
stripe_transition_energy = 0
computation_energy = 0
mac_read_cycle = 1:1:1
mac_read_energy = 0:0:0
mac_write_cycle = 1:1:1
mac_write_energy = 0:0:0
mac_line_size = 8:8:8

lb_read_cycle = 1.0:1.0:1.0
lb_read_energy = 0:0:0
lb_write_cycle = 1.0:1.0:1.0
lb_write_energy = 0:0:0
lb_line_size = 8:8:8

static_energy = 0.0:0.0:0.0
transfer_cycle_pe = 1
transfer_energy_pe = 0

frequency = 1000
bandwidth = 8000
bitwidth = 64
# PE array <-> GLB transfer granularity: nv_small moves CBUF-bank-width (8B =
# 64-bit) chunks, matching the primary memory interface atomic size.
line_size = 64:64:64

# CORRECTED 2026-08-26 (was weight_stationary). This key is the ordering authority for
# the array <-> CBUF loops (the scheduler computes the legacy-GLB offset sequence from
# it), and nv_small's CSC completes each output stripe's reduction -- all (r, s,
# C-group) slices -- before advancing to the next stripe, holding the partial sums in
# CACC at the array edge. That is OUTPUT-stationary ordering at this level; weights are
# re-read from CBUF per stripe (CBUF-resident, matching the measured fetch-once DBB
# weight traffic). The per-lane weight hold DURING a stripe is mac_stationary above,
# a different level. Under the old value the model spilled every partial sum through
# the GLB -- traffic the RTL never performs -- which inflated the critical path ~70x.
pe_stationary = output_stationary

# Atomic-K=8 x Atomic-C=8 = 64 INT8 MAC (nv_small.spec MAC_ATOMIC_K_SIZE_8 /
# MAC_ATOMIC_C_SIZE_8). width = K-direction lanes, height = C-direction lanes.
height = 8
width = 8

pe_array_read_cycle = 1.0:1.0:1.0
pe_array_read_energy = 0
pe_array_write_cycle = 1.0:1.0:1.0
pe_array_write_energy = 0

noc = bus
noc_cycle = 1
noc_energy = 0

# CBUF: 32 banks x 8B x 512 entries = 128 KiB. Simplified as one shared buffer;
# NPUsim does not separately model CBUF's input/weight bank partition or the
# CACC accumulator as a distinct structure (see plan Sec 5.3).
[shared]
stationary_type = output_stationary
memory_type = shared
memory_size = 128

read_cycle = 1.0:1.0:1.0
read_energy = 0:0:0
write_cycle = 1.0:1.0:1.0
write_energy = 0:0:0
bypass=0:1:0

static_energy = 0.0:0.0:0.0
transfer_cycle = 1
transfer_energy = 0

frequency = 1000
bandwidth = 8000
bitwidth = 64
# GLB (CBUF) access granularity: CBUF bank width = 8B = 64-bit (nv_small.spec
# CBUF_BANK_WIDTH_8, i.e. 8 bytes/bank -- see plan Sec 2.1 table).
line_size = 64:64:64

[multi_chip]
stationary_type = output_stationary
memory_type = shared
memory_size = 128

# The DBBIF accepts a request every cycle and the harness pipelines responses
# 1/beat (see the [dram] correction note): the DRAM <-> multi-chip boundary is
# deeply pipelined, not single-buffered. MC2's outstanding-request knob models
# exactly this; 128 is the harness's practical depth (never back-pressures).
max_outstanding_requests = 128

height = 1
width  = 1

read_cycle = 1.0:1.0:1.0
read_energy = 0.0:0.0:0.0
write_cycle = 1.0:1.0:1.0
write_energy = 0.0:0.0:0.0

static_energy = 0.0:0.0:0.0

frequency = 1000
bandwidth = 8000
bitwidth = 64
# num_chips=1 here, so multi-chip NoP is a pass-through; kept consistent with
# the 64-bit atomic size to avoid introducing a spurious byte-wise split.
line_size = 64:64:64

noc = bus
noc_cycle = 1
noc_energy = 0

# DBBIF primary memory interface: 64-bit (nv_small.spec PRIMARY_MEMIF_WIDTH_64).
#
# CORRECTED 2026-08-25. The first-pass config set read_cycle=64 from
# PRIMARY_MEMIF_LATENCY_64 -- a MISREADING. That spec field sizes the CDMA/MCIF
# response FIFOs for an EXPECTED round-trip latency; it is not a per-beat
# occupancy. The golden environment's memory model (verif/verilator/nvdla.cpp
# AXIResponder) is a fixed ~33-cycle-latency, 1-beat-per-cycle STREAM: r0_fifo
# is pre-filled with AXI_R_LATENCY=32 bubbles and advances one entry per cycle,
# and requests are accepted every cycle. Charging 64 cycles of occupancy per 8B
# beat serialized the whole stream and overstated the DRAM axis ~50x on
# memory-heavy traces. Per-beat occupancy is 1 cycle at the modeled clock; the
# one-time ~33-cycle pipe-fill latency has no dedicated NPUsim knob and is a
# documented unmodeled term (significant only for tiny traces -- ~20% of the
# 169-cycle micro-trace, amortized away on every calibration-scale trace).
[dram]
dram_config = DRAM/DDR3_8Gb_x16_1600.ini
output_dir = nvdla_small_DRAM

read_cycle = 1:1:1
read_energy = 0:0:0

write_cycle = 1:1:1
write_energy = 0:0:0

transfer_cycle = 1
transfer_energy = 0

frequency=1000
bandwidth=8000
bitwidth=64
# Primary memory interface atomic size: 64-bit/8B (nv_small.spec
# PRIMARY_MEMIF_WIDTH_64), max burst length 1 beat (PRIMARY_MEMIF_MAX_BURST_
# LENGTH_1) -- each DBBIF transaction is exactly one 8-byte beat, matching the
# RTL golden run (16 separate 8B weight reads, not one wide burst).
line_size=64:64:64

# ============================================================================
# SFU: nv_small SDP post-processing datapath, RTL-CALIBRATED TIMING (Phase 8,
# plan/plan_sfu.md). Measured on the same RTL/harness as the rest of this
# config (nvdla/hw master @1a65f1f, Verilator 5.022 EMULATION binary; see
# validation/nvdla/PROVENANCE.md) from CRC-PASSING official nv_small sdp_*
# traces, extracted/fitted by validation/sfu/calibrate_sdp.py (2026-08-26):
#
#   * core throughput : 1 element/cycle EXACTLY -- (cycles-fill)/(N-1) = 1.0000
#                       over 32,768 elements (sdp_4x1x8192_pass_through_int8_0)
#                       -> lanes = 1, initiation_interval = 1
#   * stream fill     : 85 cycles, N=1 and N=8 identical (sdp_1x1x{1,8}_pass_
#                       through; op-enable -> last DBB output write, RDMA incl.)
#   * X1-ALU fill     : 151 cycles = 448 - 297x1 (sdp_3x3x33_bs_int8_reg_0,
#                       register operand, no second-operand DMA). ReLU executes
#                       on the same X1 ALU stage as bias -> relu profile below.
#
# LUT-class operations (sigmoid/tanh/exp/gelu/silu/loggy and the softmax
# micro-ops) DO NOT EXIST on nv_small: spec/defs/nv_small.spec declares
# SDP_LUT_DISABLE and SDP_EW_DISABLE, so the SDP instantiates no LUT and no
# element-wise engine. (Root-caused 2026-08-26: the four official ew_* traces'
# "CRC FAIL" is exactly this -- the RTL's computed output CRC is identical
# across DIFFERENT input tensors, i.e. input-independent X1-path fallout, and
# can never match goldens generated for an EW-enabled configuration. See
# validation/sfu/SDP_CALIBRATION.md.) `supported_ops` below therefore makes
# any such operation FAIL FAST -- a missing execution unit is an architecture
# fact, not an uncalibrated cost.
# Energy: NO SDP energy measurement exists (no synthesis/power run); the energy
# keys are deliberately ABSENT so active SFU events surface as UNPRICED and
# absolute energy/power stays unqualified (plan Phase-8: no residual stuffing).
# ============================================================================
[sfu]
num_units_per_chip = 1
lanes = 1
queue_depth = 1
placement = post_accumulator
fusion = fused
setup_cycle = 0
# nv_small SDP execution units: X1 ALU+multiplier (BS/BN path -- covers ReLU and
# PReLU/leaky-class ops). No LUT, no EW engine (spec SDP_LUT_DISABLE/SDP_EW_DISABLE).
# LUT-class constants for LUT-capable NVDLA configs (sigmoid/tanh/exp/recip: fill 156,
# II 1, table-content independent) are RTL-measured on nv_small_256_full -- see
# validation/sfu/SDP_CALIBRATION.md "Ready-to-declare [sfu] profile".
supported_ops = linear,relu,leaky
relu_pipeline_latency = 151
relu_initiation_interval = 1
relu_approximation = exact
profile_reference = nv_small-SDP-RTL-nvdla/hw@1a65f1f-verilator5.022-EMU-12-CRC-PASS-traces-calibrate_sdp.py-2026-08-26
