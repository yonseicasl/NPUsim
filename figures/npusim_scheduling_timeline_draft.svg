<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#000"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#888"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#777" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1300" height="400" fill="#ffffff"/>
  <text x="12" y="12" font-size="9" fill="#999">Draft v1 — reference sketch for PPT redraw</text>

  <!-- ================= Panel (a): Tile scheduling ================= -->
  <rect x="12" y="18" width="382" height="340" fill="none" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Scheduling scheme box -->
  <rect x="80" y="36" width="230" height="20" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
  <text x="195" y="50" font-size="11.5" font-weight="bold" text-anchor="middle">Scheduling scheme</text>
  <rect x="80" y="56" width="230" height="42" fill="#ffffff" stroke="#000" stroke-width="1"/>
  <text x="90" y="72" font-size="11">Dataflow: WS (weight-stationary)</text>
  <text x="90" y="90" font-size="11">Mapping: GLB tile 4×4, LB tile 2×2</text>

  <!-- derive arrow -->
  <line x1="195" y1="98" x2="195" y2="126" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="203" y="116" font-size="10" font-style="italic" fill="#555">derive</text>

  <!-- Weight queue (stationary) -->
  <text x="24" y="153" font-size="11" font-weight="bold">Weight</text>
  <text x="24" y="165" font-size="9" fill="#555">(stationary)</text>
  <rect x="118" y="138" width="42" height="28" fill="#cfcfcf" stroke="#000" stroke-width="1.2"/>
  <text x="139" y="156" font-size="11" text-anchor="middle">W0</text>
  <line x1="139" y1="138" x2="139" y2="129" stroke="#000" stroke-width="1.5"/>
  <circle cx="139" cy="126" r="3.5" fill="#000"/>
  <text x="172" y="156" font-size="10.5">hold ×4 (reuse count)</text>

  <!-- Input queue -->
  <text x="24" y="208" font-size="11" font-weight="bold">Input</text>
  <rect x="118" y="190" width="42" height="28" fill="#ffffff" stroke="#000"/>
  <text x="139" y="208" font-size="11" text-anchor="middle">I0</text>
  <line x1="160" y1="204" x2="166" y2="204" stroke="#000" marker-end="url(#arrow)"/>
  <rect x="166" y="190" width="42" height="28" fill="#ffffff" stroke="#000"/>
  <text x="187" y="208" font-size="11" text-anchor="middle">I1</text>
  <line x1="208" y1="204" x2="214" y2="204" stroke="#000" marker-end="url(#arrow)"/>
  <rect x="214" y="190" width="42" height="28" fill="#ffffff" stroke="#000"/>
  <text x="235" y="208" font-size="11" text-anchor="middle">I2</text>
  <line x1="256" y1="204" x2="262" y2="204" stroke="#000" marker-end="url(#arrow)"/>
  <rect x="262" y="190" width="42" height="28" fill="#ffffff" stroke="#000"/>
  <text x="283" y="208" font-size="11" text-anchor="middle">I3</text>
  <path d="M 304 214 C 330 234, 210 242, 132 224" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arrowGray)"/>
  <text x="218" y="243" font-size="9.5" font-style="italic" fill="#777">rotate</text>

  <!-- Output queue -->
  <text x="24" y="276" font-size="11" font-weight="bold">Output</text>
  <rect x="118" y="258" width="42" height="28" fill="#ffffff" stroke="#000"/>
  <text x="139" y="276" font-size="11" text-anchor="middle">O0</text>
  <line x1="160" y1="272" x2="166" y2="272" stroke="#000" marker-end="url(#arrow)"/>
  <rect x="166" y="258" width="42" height="28" fill="#ffffff" stroke="#000"/>
  <text x="187" y="276" font-size="11" text-anchor="middle">O1</text>
  <line x1="208" y1="272" x2="214" y2="272" stroke="#000" marker-end="url(#arrow)"/>
  <rect x="214" y="258" width="42" height="28" fill="#ffffff" stroke="#000"/>
  <text x="235" y="276" font-size="11" text-anchor="middle">O2</text>
  <line x1="256" y1="272" x2="262" y2="272" stroke="#000" marker-end="url(#arrow)"/>
  <rect x="262" y="258" width="42" height="28" fill="#ffffff" stroke="#000"/>
  <text x="283" y="276" font-size="11" text-anchor="middle">O3</text>
  <path d="M 304 282 C 330 302, 210 310, 132 292" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arrowGray)"/>
  <text x="218" y="311" font-size="9.5" font-style="italic" fill="#777">rotate</text>

  <text x="203" y="345" font-size="9.5" fill="#555" text-anchor="middle" font-style="italic">per-datatype tile queues (offsets in source memory)</text>

  <!-- ============ inter-panel arrow ============ -->
  <text x="456" y="184" font-size="11" font-weight="bold" text-anchor="middle">tile schedule</text>
  <text x="456" y="197" font-size="9.5" text-anchor="middle" fill="#333">(offsets, reuse counts)</text>
  <line x1="398" y1="207" x2="512" y2="207" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ================= Panel (b): Cycle-level timeline ================= -->
  <rect x="518" y="18" width="772" height="340" fill="none" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- overlap annotation -->
  <rect x="683" y="64" width="54" height="86" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="710" y="58" font-size="9.5" fill="#555" text-anchor="middle" font-style="italic">overlap</text>

  <!-- Row: DRAM (cost 3/tile) -->
  <text x="594" y="89" font-size="11" font-weight="bold" text-anchor="end">DRAM</text>
  <rect x="602" y="70" width="81" height="28" fill="#ffffff" stroke="#000"/><text x="642" y="88" font-size="10.5" text-anchor="middle">T0</text>
  <rect x="683" y="70" width="81" height="28" fill="#e6e6e6" stroke="#000"/><text x="723" y="88" font-size="10.5" text-anchor="middle">T1</text>
  <rect x="764" y="70" width="81" height="28" fill="#cccccc" stroke="#000"/><text x="804" y="88" font-size="10.5" text-anchor="middle">T2</text>
  <rect x="845" y="70" width="81" height="28" fill="#b3b3b3" stroke="#000"/><text x="885" y="88" font-size="10.5" text-anchor="middle">T3</text>

  <!-- Row: Global buffer (cost 2/tile) -->
  <text x="594" y="137" font-size="11" font-weight="bold" text-anchor="end">Global buffer</text>
  <rect x="683" y="118" width="54" height="28" fill="#ffffff" stroke="#000"/><text x="710" y="136" font-size="10.5" text-anchor="middle">T0</text>
  <rect x="764" y="118" width="54" height="28" fill="#e6e6e6" stroke="#000"/><text x="791" y="136" font-size="10.5" text-anchor="middle">T1</text>
  <rect x="845" y="118" width="54" height="28" fill="#cccccc" stroke="#000"/><text x="872" y="136" font-size="10.5" text-anchor="middle">T2</text>
  <rect x="926" y="118" width="54" height="28" fill="#b3b3b3" stroke="#000"/><text x="953" y="136" font-size="10.5" text-anchor="middle">T3</text>

  <!-- Row: PE array (cost 2/tile) + stall -->
  <text x="594" y="185" font-size="11" font-weight="bold" text-anchor="end">PE array</text>
  <rect x="737" y="166" width="54" height="28" fill="#ffffff" stroke="#000"/><text x="764" y="184" font-size="10.5" text-anchor="middle">T0</text>
  <rect x="818" y="166" width="54" height="28" fill="#e6e6e6" stroke="#000"/><text x="845" y="184" font-size="10.5" text-anchor="middle">T1</text>
  <rect x="899" y="166" width="54" height="28" fill="#cccccc" stroke="#000"/><text x="926" y="184" font-size="10.5" text-anchor="middle">T2</text>
  <rect x="980" y="166" width="27" height="28" fill="url(#hatch)" stroke="#000"/>
  <text x="993" y="161" font-size="9.5" fill="#555" text-anchor="middle" font-style="italic">stall</text>
  <rect x="1007" y="166" width="54" height="28" fill="#b3b3b3" stroke="#000"/><text x="1034" y="184" font-size="10.5" text-anchor="middle">T3</text>

  <!-- Row: PE (cost 4/tile, bottleneck) -->
  <text x="594" y="233" font-size="11" font-weight="bold" text-anchor="end">PE</text>
  <rect x="791" y="214" width="108" height="28" fill="#ffffff" stroke="#000"/><text x="845" y="232" font-size="10.5" text-anchor="middle">T0</text>
  <rect x="899" y="214" width="108" height="28" fill="#e6e6e6" stroke="#000"/><text x="953" y="232" font-size="10.5" text-anchor="middle">T1</text>
  <rect x="1007" y="214" width="108" height="28" fill="#cccccc" stroke="#000"/><text x="1061" y="232" font-size="10.5" text-anchor="middle">T2</text>
  <rect x="1115" y="214" width="108" height="28" fill="#b3b3b3" stroke="#000"/><text x="1169" y="232" font-size="10.5" text-anchor="middle">T3</text>
  <text x="1223" y="256" font-size="9.5" fill="#777" text-anchor="end" font-style="italic">bottleneck stage runs back-to-back</text>

  <!-- T0 dependency arrows -->
  <line x1="683" y1="98" x2="683" y2="115" stroke="#888" stroke-width="1.2" marker-end="url(#arrowGray)"/>
  <line x1="737" y1="146" x2="737" y2="163" stroke="#888" stroke-width="1.2" marker-end="url(#arrowGray)"/>
  <line x1="791" y1="194" x2="791" y2="211" stroke="#888" stroke-width="1.2" marker-end="url(#arrowGray)"/>

  <!-- axis -->
  <line x1="602" y1="276" x2="1245" y2="276" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="1252" y="280" font-size="10.5" font-style="italic">cycles</text>
  <line x1="602" y1="272" x2="602" y2="280" stroke="#000"/><text x="602" y="292" font-size="9" fill="#555" text-anchor="middle">0</text>
  <line x1="737" y1="272" x2="737" y2="280" stroke="#000"/><text x="737" y="292" font-size="9" fill="#555" text-anchor="middle">5</text>
  <line x1="872" y1="272" x2="872" y2="280" stroke="#000"/><text x="872" y="292" font-size="9" fill="#555" text-anchor="middle">10</text>
  <line x1="1007" y1="272" x2="1007" y2="280" stroke="#000"/><text x="1007" y="292" font-size="9" fill="#555" text-anchor="middle">15</text>
  <line x1="1142" y1="272" x2="1142" y2="280" stroke="#000"/><text x="1142" y="292" font-size="9" fill="#555" text-anchor="middle">20</text>

  <!-- legend -->
  <rect x="602" y="306" width="24" height="14" fill="url(#hatch)" stroke="#000"/>
  <text x="632" y="317" font-size="10">stall (back-pressure)</text>
  <rect x="770" y="306" width="14" height="14" fill="#ffffff" stroke="#000"/>
  <rect x="784" y="306" width="14" height="14" fill="#cccccc" stroke="#000"/>
  <rect x="798" y="306" width="14" height="14" fill="#b3b3b3" stroke="#000"/>
  <text x="818" y="317" font-size="10">T0–T3: consecutive data tiles</text>
  <text x="602" y="340" font-size="9.5" fill="#555" font-style="italic">double-buffered boundary → stages overlap;  single-buffered → serialized</text>

  <!-- panel labels -->
  <text x="203" y="384" font-size="12" text-anchor="middle">(a) Tile scheduling</text>
  <text x="904" y="384" font-size="12" text-anchor="middle">(b) Cycle-level timeline</text>
</svg>
