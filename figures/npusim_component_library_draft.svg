<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="550" fill="#ffffff"/>
  <text x="10" y="14" font-size="9" fill="#999">Draft v1 — Fig. for 4.2 (single column)</text>

  <!-- ============ Hardware specification card ============ -->
  <rect x="25" y="30" width="190" height="22" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
  <text x="120" y="45" font-size="11.5" font-weight="bold" text-anchor="middle">Hardware specification</text>
  <rect x="25" y="52" width="190" height="134" fill="#ffffff" stroke="#000" stroke-width="1"/>
  <text x="38" y="72" font-size="10.5" font-family="Courier New, monospace">[accelerator]</text>
  <text x="38" y="92" font-size="10.5" font-family="Courier New, monospace">[systolic_array]</text>
  <text x="38" y="112" font-size="10.5" font-family="Courier New, monospace">[shared]</text>
  <text x="38" y="132" font-size="10.5" font-family="Courier New, monospace">[multi_chip]</text>
  <text x="38" y="152" font-size="10.5" font-family="Courier New, monospace">[dram]</text>
  <text x="38" y="172" font-size="10.5" font-family="Courier New, monospace" fill="#888">[decomp]</text>
  <text x="122" y="172" font-size="9" fill="#888" font-style="italic">(optional)</text>

  <!-- declare arrow -->
  <line x1="219" y1="110" x2="261" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="100" font-size="10" font-style="italic" fill="#555" text-anchor="middle">declare</text>

  <!-- ============ Component library ============ -->
  <rect x="265" y="32" width="410" height="210" fill="none" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="470" y="50" font-size="12" font-weight="bold" text-anchor="middle">Component library</text>

  <text x="275" y="78" font-size="10.5" font-weight="bold">PE</text>
  <rect x="360" y="62" width="220" height="24" rx="4" fill="#f0f0f0" stroke="#000"/>
  <text x="470" y="78" font-size="10" text-anchor="middle">MAC units + per-datatype LBs</text>

  <text x="275" y="114" font-size="10.5" font-weight="bold">PE array</text>
  <rect x="360" y="98" width="68" height="24" rx="4" fill="#f0f0f0" stroke="#000"/>
  <text x="394" y="114" font-size="10" text-anchor="middle">spatial</text>
  <rect x="434" y="98" width="72" height="24" rx="4" fill="#f0f0f0" stroke="#000"/>
  <text x="470" y="114" font-size="10" text-anchor="middle">systolic</text>
  <rect x="512" y="98" width="84" height="24" rx="4" fill="#f0f0f0" stroke="#000"/>
  <text x="554" y="114" font-size="10" text-anchor="middle">adder-tree</text>

  <text x="275" y="150" font-size="10.5" font-weight="bold">Global buffer</text>
  <rect x="360" y="134" width="66" height="24" rx="4" fill="#f0f0f0" stroke="#000"/>
  <text x="393" y="150" font-size="10" text-anchor="middle">shared</text>
  <rect x="432" y="134" width="74" height="24" rx="4" fill="#f0f0f0" stroke="#000"/>
  <text x="469" y="150" font-size="10" text-anchor="middle">separate</text>
  <text x="514" y="150" font-size="9" fill="#666">double buffer · bypass</text>

  <text x="275" y="186" font-size="10.5" font-weight="bold">Package</text>
  <rect x="360" y="170" width="180" height="24" rx="4" fill="#f0f0f0" stroke="#000"/>
  <text x="450" y="186" font-size="10" text-anchor="middle">chip grid + NoP (multicast)</text>

  <text x="275" y="222" font-size="10.5" font-weight="bold">DRAM</text>
  <rect x="360" y="206" width="80" height="24" rx="4" fill="#f0f0f0" stroke="#000"/>
  <text x="400" y="222" font-size="10" text-anchor="middle">analytical</text>
  <rect x="446" y="206" width="84" height="24" rx="4" fill="#f0f0f0" stroke="#000"/>
  <text x="488" y="222" font-size="10" text-anchor="middle">DRAMsim3</text>

  <!-- compose arrows -->
  <line x1="380" y1="246" x2="140" y2="296" stroke="#000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="470" y1="246" x2="350" y2="296" stroke="#000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="560" y1="246" x2="570" y2="296" stroke="#000" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="475" y="275" font-size="10" font-style="italic" fill="#555">compose</text>

  <!-- ============ Panel A: Eyeriss-like (spatial) ============ -->
  <rect x="25" y="300" width="200" height="170" fill="none" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,4"/>
  <g stroke="#000" fill="#f0f0f0">
    <rect x="65"  y="315" width="24" height="18"/><rect x="97"  y="315" width="24" height="18"/><rect x="129" y="315" width="24" height="18"/><rect x="161" y="315" width="24" height="18"/>
    <rect x="65"  y="339" width="24" height="18"/><rect x="97"  y="339" width="24" height="18"/><rect x="129" y="339" width="24" height="18"/><rect x="161" y="339" width="24" height="18"/>
    <rect x="65"  y="363" width="24" height="18"/><rect x="97"  y="363" width="24" height="18"/><rect x="129" y="363" width="24" height="18"/><rect x="161" y="363" width="24" height="18"/>
  </g>
  <text x="125" y="328" font-size="8.5" text-anchor="middle" fill="#333">PEs</text>
  <line x1="125" y1="381" x2="125" y2="395" stroke="#000" stroke-width="1"/>
  <text x="132" y="392" font-size="8.5" fill="#666">bus</text>
  <rect x="55" y="395" width="140" height="20" fill="#e0e0e0" stroke="#000"/>
  <text x="125" y="409" font-size="10" text-anchor="middle">Global buffer</text>
  <line x1="125" y1="415" x2="125" y2="425" stroke="#000" stroke-width="1"/>
  <rect x="55" y="425" width="140" height="18" fill="#d0d0d0" stroke="#000"/>
  <text x="125" y="438" font-size="10" text-anchor="middle">DRAM</text>

  <!-- ============ Panel B: TPU-like (systolic) ============ -->
  <rect x="250" y="300" width="200" height="170" fill="none" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,4"/>
  <rect x="285" y="315" width="130" height="70" fill="#f0f0f0" stroke="#000"/>
  <text x="350" y="347" font-size="10" text-anchor="middle">Systolic array</text>
  <text x="350" y="361" font-size="8.5" text-anchor="middle" fill="#666">(e.g., 256×128)</text>
  <line x1="350" y1="385" x2="350" y2="395" stroke="#000" stroke-width="1"/>
  <rect x="285" y="395" width="130" height="20" fill="#e0e0e0" stroke="#000"/>
  <text x="350" y="409" font-size="10" text-anchor="middle">Global buffer (MBs)</text>
  <line x1="350" y1="415" x2="350" y2="425" stroke="#000" stroke-width="1"/>
  <rect x="285" y="425" width="130" height="18" fill="#d0d0d0" stroke="#000"/>
  <text x="350" y="438" font-size="10" text-anchor="middle">HBM</text>

  <!-- ============ Panel C: Simba-like (multi-chip) ============ -->
  <rect x="475" y="300" width="200" height="170" fill="none" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- mesh lines -->
  <g stroke="#999" stroke-width="1">
    <line x1="523" y1="329" x2="647" y2="329"/><line x1="523" y1="373" x2="647" y2="373"/><line x1="523" y1="417" x2="647" y2="417"/>
    <line x1="523" y1="329" x2="523" y2="417"/><line x1="575" y1="329" x2="575" y2="417"/><line x1="627" y1="329" x2="627" y2="417"/>
  </g>
  <g stroke="#000" fill="#ffffff">
    <rect x="503" y="312" width="40" height="34"/><rect x="555" y="312" width="40" height="34"/><rect x="607" y="312" width="40" height="34"/>
    <rect x="503" y="356" width="40" height="34"/><rect x="555" y="356" width="40" height="34"/><rect x="607" y="356" width="40" height="34"/>
    <rect x="503" y="400" width="40" height="34"/><rect x="555" y="400" width="40" height="34"/><rect x="607" y="400" width="40" height="34"/>
  </g>
  <g fill="#f0f0f0" stroke="#000" stroke-width="0.8">
    <rect x="514" y="320" width="18" height="12"/><rect x="566" y="320" width="18" height="12"/><rect x="618" y="320" width="18" height="12"/>
    <rect x="514" y="364" width="18" height="12"/><rect x="566" y="364" width="18" height="12"/><rect x="618" y="364" width="18" height="12"/>
    <rect x="514" y="408" width="18" height="12"/><rect x="566" y="408" width="18" height="12"/><rect x="618" y="408" width="18" height="12"/>
  </g>
  <text x="659" y="322" font-size="8.5" fill="#666">NoP</text>
  <rect x="503" y="444" width="144" height="16" fill="#d0d0d0" stroke="#000"/>
  <text x="575" y="456" font-size="9.5" text-anchor="middle">DRAM</text>

  <!-- captions -->
  <text x="125" y="488" font-size="11.5" font-weight="bold" text-anchor="middle">Eyeriss-like</text>
  <text x="125" y="502" font-size="9" fill="#666" text-anchor="middle" font-family="Courier New, monospace">[spatial_arch]+[separate], bus</text>
  <text x="350" y="488" font-size="11.5" font-weight="bold" text-anchor="middle">TPU-like</text>
  <text x="350" y="502" font-size="9" fill="#666" text-anchor="middle" font-family="Courier New, monospace">[systolic_array]+[shared], HBM</text>
  <text x="575" y="488" font-size="11.5" font-weight="bold" text-anchor="middle">Simba-like</text>
  <text x="575" y="502" font-size="9" fill="#666" text-anchor="middle" font-family="Courier New, monospace">[multi_chip] 6×6, NoP mesh</text>

  <!-- punchline -->
  <text x="350" y="532" font-size="10.5" font-style="italic" fill="#555" text-anchor="middle">One component library composes into diverse NPU architectures.</text>
</svg>
