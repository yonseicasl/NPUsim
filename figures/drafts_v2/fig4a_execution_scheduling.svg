<svg xmlns="http://www.w3.org/2000/svg" width="600" height="678" viewBox="0 0 600 678" role="img" aria-labelledby="title desc">
<title id="title">Fig. 4(a). Decoupled execution scheduling</title><desc id="desc">Schedulers select tile offsets and reuse counts independently of hardware timing. A weight-stationary example holds one weight tile for four input tiles. Requests propagate up the hierarchy and per-boundary schedulers select tile deliveries.</desc>
