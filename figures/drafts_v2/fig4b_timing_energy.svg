<title id="title">Fig. 4(b). Cycle-level timing and energy</title><desc id="desc">Illustrative double-buffered pipeline with four work tiles, transfer stages of two cycles and compute stages of four cycles. The global-to-local transfer stalls while local buffer slots are occupied. The compute stage is the bottleneck. These are illustrative timings, not measured results.</desc>
